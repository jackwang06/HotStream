<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HotStream 文案编辑器</title>
  <script>(function(){try{var t=localStorage.getItem('hotstream.theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <style>
    :root {
      --bg: #0e120f;
      --surface: #161b17;
      --surface-2: #1d231f;
      --surface-3: #252d27;
      --border: #2b332d;
      --border-strong: #3a443c;
      --card: #161b17;
      --line: #2b332d;
      --text: #eef2ee;
      --text-2: #c2cbc4;
      --muted: #8b988f;
      --primary: #2fb389;
      --primary-hover: #38c79a;
      --primary-active: #259a75;
      --primary-soft: rgba(47, 179, 137, .14);
      --primary-ring: rgba(47, 179, 137, .45);
      --accent: #2fb389;
      --accent-soft: rgba(47, 179, 137, .14);
      --accent-warm: #d9a23b;
      --accent-warm-soft: rgba(217, 162, 59, .16);
      --on-accent: #07140e;
      --ok: #3ec98a;
      --danger: #e76273;
      --danger-soft: rgba(231, 98, 115, .16);
      --radius: 12px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 999px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-menu: 0 4px 16px rgba(0, 0, 0, .45);
      --t-fast: 120ms ease-out;
      --t-base: 170ms ease-out;
      --t-slow: 200ms ease-in-out;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Code", "Sarasa Mono SC", monospace;
      --editor-work-area-height: calc(100vh - 312px);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 80% -10%, var(--primary-soft), transparent 60%),
        radial-gradient(900px 460px at 0% 110%, var(--accent-warm-soft), transparent 55%),
        var(--bg);
    }

    button, textarea, input, select { font: inherit; }
    button { cursor: pointer; }

    .icon { display: inline-block; vertical-align: -0.125em; flex: none; }

    .page {
      width: min(1560px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand .logo .icon { width: 22px; height: 22px; }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      color: var(--on-accent);
      background: var(--primary);
    }

    .toolbar {
      /* Drop the toolbar onto its own row below the brand so it never sits under
         the fixed top-right user bar (设置/草稿/登出). */
      flex: 1 1 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      color: var(--text);
      background: var(--surface-2);
      font-weight: 600;
      transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast);
    }
    .btn .icon { width: 16px; height: 16px; }

    .btn:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .btn:active { transform: scale(.98); }
    .btn.primary { border-color: var(--primary); color: var(--on-accent); background: var(--primary); }
    .btn.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
    .btn.accent { border-color: transparent; color: var(--on-accent); background: linear-gradient(135deg, var(--primary-active), var(--primary)); }
    .btn.accent:hover { filter: brightness(1.06); background: linear-gradient(135deg, var(--primary-active), var(--primary)); }
    .btn.danger { color: var(--danger); background: transparent; border-color: var(--danger-soft); }
    .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn.small { padding: 7px 9px; border-radius: var(--radius-md); font-size: 12px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, .7fr) minmax(440px, 1.25fr) minmax(280px, .6fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      min-height: calc(100vh - 126px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
    .panel-title .icon { width: 18px; height: 18px; color: var(--primary); }
    .step {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      color: var(--on-accent);
      background: var(--primary);
      font-size: 13px;
      font-weight: 800;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px 18px 18px; }

    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .field label { color: var(--text-2); font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input, select { padding: 12px 13px; }
    textarea {
      resize: vertical;
      padding: 13px;
      line-height: 1.76;
      font-size: 15px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .editor-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    .meta-line { color: var(--muted); font-size: 12px; line-height: 1.65; }

    /* ── WYSIWYG 富文本工具栏（作用于可编辑预览） ── */
    .rt-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .rt-group { display: inline-flex; align-items: center; gap: 4px; padding-right: 6px; border-right: 1px solid var(--border); }
    .rt-group:last-child { border-right: 0; padding-right: 0; }
    .rt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      background: var(--surface);
      font-weight: 700;
      font-size: 13px;
      transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast);
    }
    .rt-btn:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .rt-btn .icon { width: 16px; height: 16px; }
    .rt-btn[data-active="1"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .rt-btn.b-style { font-weight: 800; }
    .rt-btn.i-style { font-style: italic; font-family: serif; }
    .rt-btn.u-style { text-decoration: underline; }
    .rt-select {
      width: auto;
      min-width: 92px;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--radius-md);
      font-size: 13px;
      background: var(--surface);
    }
    .rt-color {
      width: 34px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      cursor: pointer;
    }
    .rt-color::-webkit-color-swatch-wrapper { padding: 0; }
    .rt-color::-webkit-color-swatch { border: 0; border-radius: 3px; }

    .image-block-body { padding: 12px; }
    .image-block-body img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius-md);
      background: var(--surface-3);
    }
    .image-caption { margin-top: 8px; color: var(--muted); font-size: 12px; }

    /* 预览外框：深色（与编辑器一致）；内部成品文档刻意保持白底（所见即所得，对应导出长图） */
    .preview-wrap {
      min-height: var(--editor-work-area-height);
      overflow: auto;
      padding: 18px;
      background: var(--surface-2);
    }
    .preview-doc {
      width: min(100%, 580px);
      margin: 0 auto;
      padding: 34px 34px 42px;
      border-radius: var(--radius-xl);
      background: #ffffff;
      color: #1c1917;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
    .preview-doc:focus { outline: none; }
    .preview-doc:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
    .preview-doc h1 { margin: 0 0 18px; line-height: 1.25; letter-spacing: 0; font-size: 30px; font-weight: 800; color: #1c1917; }
    .preview-doc h2 { margin: 26px 0 12px; line-height: 1.3; font-size: 23px; font-weight: 800; color: #1c1917; }
    .preview-doc h3 { margin: 22px 0 10px; line-height: 1.35; font-size: 19px; font-weight: 700; color: #292524; }
    .preview-doc .source { margin-bottom: 22px; color: #78716c; font-size: 13px; }
    .preview-doc p { margin: 0 0 15px; line-height: 1.86; font-size: 16px; color: #1c1917; }
    .preview-doc strong { font-weight: 800; }
    .preview-doc em { font-style: italic; }
    .preview-doc figure { margin: 18px 0; }
    .preview-doc figure img,
    .preview-doc > img { display: block; width: 100%; max-height: 540px; object-fit: contain; margin: 0; border-radius: var(--radius-lg); background: #f3f4f6; }
    .preview-empty { color: #78716c; text-align: center; padding: 60px 0; }

    /* 编辑态修饰：图片块的删除/替换按钮（导出时移除） */
    .preview-doc figure { position: relative; }
    .fig-tools {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--t-fast);
    }
    .preview-doc figure:hover .fig-tools { opacity: 1; }
    .fig-tools button {
      border: 1px solid rgba(0,0,0,.12);
      border-radius: var(--radius-md);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1c1917;
      background: rgba(255,255,255,.92);
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .fig-tools button.del { color: #c62f46; }
    /* contenteditable placeholder for empty doc */
    .preview-doc[data-empty="1"] > p:only-child:empty::before,
    .preview-doc[data-empty="1"]:empty::before {
      content: '在这里直接书写正文；用上方工具栏设标题级别与格式，从右侧素材插入图片。';
      color: #a8a29e;
    }

    .material-actions { display: grid; gap: 10px; }
    .upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 14px;
      color: var(--primary);
      background: var(--primary-soft);
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .upload-label:hover { border-color: var(--primary); }
    .upload-label .icon { width: 16px; height: 16px; }
    .upload-label input { display: none; }
    .material-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .material-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }
    .material-card[draggable="true"] { cursor: grab; }
    .material-card img { display: block; width: 100%; aspect-ratio: 1.25; object-fit: cover; background: var(--surface-3); }
    .material-info { padding: 8px; }
    .material-title { overflow: hidden; margin-bottom: 8px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .material-card button { width: 100%; border-radius: var(--radius-md); padding: 8px 9px; font-size: 12px; }
    .empty { padding: 22px; border: 1px dashed var(--border); border-radius: var(--radius-lg); color: var(--muted); text-align: center; background: var(--surface-2); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 18px;
      border-radius: var(--radius-full);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-menu);
      transition: opacity var(--t-base), transform var(--t-base);
      font-size: 14px;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1180px) {
      .workspace { grid-template-columns: 1fr; }
      .panel { min-height: auto; }
      .preview-wrap { min-height: 360px; }
      .material-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 620px) {
      .page { width: min(100% - 24px, 1560px); padding-top: 20px; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .editor-tools, .material-grid { grid-template-columns: 1fr; }
      .preview-doc { padding: 24px 22px 32px; }
    }

    :root[data-theme="light"] {
      --bg:           #f3f6f2;
      --surface:      #ffffff;
      --surface-2:    #eef2ee;
      --surface-3:    #e3e9e4;
      --border:        #dde4de;
      --border-strong: #c6cfc8;
      --card:          #ffffff;
      --line:          #dde4de;
      --text:        #18201b;
      --text-2:      #3d4843;
      --muted:       #5d6860;
      --primary:        #137055;
      --primary-hover:  #1a9670;
      --primary-active: #11684d;
      --primary-soft:   rgba(21, 128, 95, 0.12);
      --primary-ring:   rgba(21, 128, 95, 0.32);
      --accent:         #137055;
      --accent-soft:    rgba(21, 128, 95, 0.12);
      --accent-warm:      #8a5e10;
      --accent-warm-soft: rgba(154, 106, 18, 0.15);
      --on-accent: #ffffff;
      --ok:        #1f9c66;
      --danger:    #c62f46;
      --danger-soft:  rgba(198, 47, 70, 0.12);
      --shadow:       0 1px 2px rgba(20, 30, 24, 0.08);
      --shadow-menu:  0 6px 20px rgba(20, 30, 24, 0.12);
    }

    :root.theme-anim, :root.theme-anim *, :root.theme-anim *::before, :root.theme-anim *::after { transition: background-color .3s ease, border-color .3s ease, color .3s ease, fill .3s ease, box-shadow .3s ease !important; }
  </style>
  <!-- 本地内置库（由 vendor agent 放置；中间件已放行 .js 静态文件） -->
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/turndown.js"></script>
  <script src="/vendor/html2canvas.min.js"></script>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><div class="logo"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg></div><span>HotStream 文案编辑器</span></div>
      <div class="toolbar">
        <button class="btn" id="backBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>返回生成页</button>
        <button class="btn" id="loadDraftBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>载入草稿</button>
        <button class="btn" id="saveDraftBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>保存草稿</button>
        <button class="btn accent" id="exportImageBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19 3 3v-5.5"/><path d="m17 22 3-3"/><circle cx="9" cy="9" r="2"/></svg>导出长图</button>
      </div>
    </header>

    <section class="workspace">
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title"><span class="step">1</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>文案信息</div>
          <span class="hint" id="wordCount">0 字</span>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="editorTitle">标题</label>
            <input id="editorTitle" placeholder="给这篇文案起一个标题" />
          </div>
          <div class="editor-tools">
            <button class="btn" id="addParagraphBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>追加段落</button>
            <button class="btn danger" id="clearDraftBtn"><svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>清空编辑页</button>
          </div>
          <div class="meta-line">直接在中间的预览里改字、回车换段、删段；用上方工具栏设标题级别与加粗/斜体/下划线/颜色/字体；图片从右侧素材插入。所见即所得。</div>
          <div class="field" style="margin-top:14px;">
            <label for="markdownSource">Markdown 源码（只读，调试用）</label>
            <textarea id="markdownSource" readonly aria-readonly="true" style="min-height:160px;font-family:var(--font-mono);font-size:13px;" placeholder="编辑预览后这里会显示对应的 Markdown 源码"></textarea>
          </div>
          <div class="meta-line" id="draftMeta">草稿会保存在本机浏览器 localStorage；下次从主页点“继续编辑草稿”或直接打开编辑页会自动载入。</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title"><span class="step">2</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>预览即编辑</div>
          <select id="platformPreset" aria-label="平台预设">
            <option value="xhs">小红书长图 · 1080 宽</option>
            <option value="wechat">公众号头图感 · 900 宽</option>
            <option value="simple">简洁通用 · 800 宽</option>
          </select>
        </div>
        <div class="rt-toolbar" id="rtToolbar" aria-label="富文本工具栏">
          <div class="rt-group">
            <select class="rt-select" id="blockLevel" title="标题级别" aria-label="标题级别">
              <option value="p">正文</option>
              <option value="h1">H1 主标题</option>
              <option value="h2">H2 小标题</option>

            </select>
          </div>
          <div class="rt-group">
            <button class="rt-btn b-style" data-cmd="bold" title="加粗 (Ctrl+B)" aria-label="加粗">B</button>
            <button class="rt-btn i-style" data-cmd="italic" title="斜体 (Ctrl+I)" aria-label="斜体">I</button>
            <button class="rt-btn u-style" data-cmd="underline" title="下划线 (Ctrl+U)" aria-label="下划线">U</button>

          <div class="rt-group">
            <label class="rt-btn" for="foreColor" title="文字颜色" aria-label="文字颜色" style="padding:0 6px;">
              <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
            </label>
            <input class="rt-color" type="color" id="foreColor" value="#e11d48" title="选择文字颜色" aria-label="选择文字颜色" />
            <select class="rt-select" id="fontName" title="字体" aria-label="字体">
              <option value="">默认字体</option>
              <option value="'PingFang SC','Microsoft YaHei',sans-serif">黑体 / 无衬线</option>
              <option value="'Songti SC','SimSun',serif">宋体 / 衬线</option>
              <option value="'KaiTi','STKaiti',serif">楷体</option>
              <option value="'Source Han Serif SC',serif">思源宋体</option>
              <option value="ui-monospace,monospace">等宽</option>
            </select>
          </div>
          <div class="rt-group">
            <button class="rt-btn" id="toolbarInsertImage" title="从素材插入图片到光标处" aria-label="插入图片">
              <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            </button>
          </div>
        </div>
        <div class="preview-wrap">
          <article class="preview-doc" id="previewDoc" contenteditable="true" spellcheck="false" aria-label="可直接编辑的文案预览"></article>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title"><span class="step">3</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>素材区</div>
          <span class="hint">生成图 + 手动导入</span>
        </div>
        <div class="panel-body">
          <div class="material-actions">
            <label class="upload-label">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
              导入本地图片到素材区
              <input id="assetUpload" type="file" accept="image/*" multiple />
            </label>
            <div class="meta-line">点击“插入预览”或把素材拖到中间预览里，图片会以可视化卡片进入正文并参与长图导出。</div>
          </div>
          <div class="material-grid" id="materialGrid"></div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast">已完成</div>

  <script>
    const IMPORT_KEY = 'hotstream.editorDraft';
    const LIVE_KEY = 'hotstream.editorLiveDraft';
    const titleInput = document.getElementById('editorTitle');
    const materialGrid = document.getElementById('materialGrid');
    const previewDoc = document.getElementById('previewDoc');
    const markdownSource = document.getElementById('markdownSource');
    const wordCount = document.getElementById('wordCount');
    const toast = document.getElementById('toast');
    const draftMeta = document.getElementById('draftMeta');
    const blockLevelSelect = document.getElementById('blockLevel');
    let blocks = [];
    let materials = [];
    let sourceTopic = null;
    let currentDraftId = null;
    let savedSelection = null; // remembered Range so toolbar buttons keep the caret/selection

    // ── Markdown <-> HTML helpers (vendor libs) ──
    const turndownService = (typeof TurndownService !== 'undefined')
      ? new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', emDelimiter: '*', strongDelimiter: '**' })
      : null;
    if (turndownService) {
      // 保留颜色/字体/下划线等 Markdown 不原生支持的内联 HTML。
      turndownService.keep(['span', 'u', 'font']);
    }

    const presets = {
      xhs: { width: 1080 },
      wechat: { width: 900 },
      simple: { width: 800 }
    };

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1900);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }

    function makeId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function proxyImageUrl(url) {
      if (!url || url.startsWith('data:') || url.startsWith('/api/proxy-image')) return url;
      return `/api/proxy-image?url=${encodeURIComponent(url)}`;
    }

    // ── inline Markdown <-> inline HTML for a single text block ──
    function inlineMdToHtml(md) {
      const raw = String(md == null ? '' : md);
      if (!raw.trim()) return '';
      if (typeof marked !== 'undefined' && typeof marked.parseInline === 'function') {
        try { return marked.parseInline(raw); } catch (e) { /* fall through */ }
      }
      return escapeHtml(raw);
    }

    function inlineHtmlToMd(html) {
      const raw = String(html == null ? '' : html);
      if (turndownService) {
        try {
          // turndown 对块级标签会包成段落；我们传入的是内联片段，去掉首尾空白即可。
          return turndownService.turndown(raw).trim();
        } catch (e) { /* fall through */ }
      }
      // 退化：剥掉标签，保留文本。
      const tmp = document.createElement('div');
      tmp.innerHTML = raw;
      return (tmp.textContent || '').trim();
    }

    function normalizeImage(image, index = 0) {
      const raw = image?.originalUrl || image?.url || image?.thumbnail || image?.displayUrl || '';
      const title = image?.title || `素材 ${index + 1}`;
      return {
        id: image?.id || makeId(`asset-${index}`),
        title,
        originalUrl: raw,
        displayUrl: image?.displayUrl || proxyImageUrl(raw),
        source: image?.source || '生成图片'
      };
    }

    function ensureMaterialForImage(url, title = '正文图片') {
      const normalizedUrl = proxyImageUrl(url);
      let asset = materials.find(item => item.displayUrl === normalizedUrl || item.originalUrl === url);
      if (!asset) {
        asset = normalizeImage({ url, title, source: '正文图片' }, materials.length);
        materials.unshift(asset);
      }
      return asset;
    }

    // ── Block model: text {id,type:'text',level,md} | image {id,type:'image',url,title,assetId} ──
    const HEADING_LEVELS = new Set(['h1', 'h2', 'h3']);

    function normalizeBlock(block, index = 0) {
      if (block?.type === 'image') {
        const url = block.url || block.displayUrl || block.originalUrl || '';
        const asset = block.assetId ? materials.find(item => item.id === block.assetId) : ensureMaterialForImage(url, block.title || block.alt || `图片 ${index + 1}`);
        return {
          id: block.id || makeId('image'),
          type: 'image',
          title: block.title || block.alt || asset?.title || `图片 ${index + 1}`,
          url: asset?.displayUrl || proxyImageUrl(url),
          assetId: asset?.id || null
        };
      }
      // text block — backward compatible with legacy {type:'text', text}
      let level = (block && block.level) || 'p';
      if (!HEADING_LEVELS.has(level) && level !== 'p') level = 'p';
      let md = block && block.md != null ? String(block.md) : null;
      if (md == null) md = block && block.text != null ? String(block.text) : '';
      return {
        id: block?.id || makeId('text'),
        type: 'text',
        level,
        md: md
      };
    }

    // ── markdownToBlocks(md) -> blocks (contract) ──
    function markdownToBlocks(md) {
      const text = String(md == null ? '' : md).replace(/\r\n/g, '\n');
      const out = [];
      // Split into paragraphs by blank lines, but keep heading lines as their own block.
      const lines = text.split('\n');
      let buffer = [];
      const flushParagraph = () => {
        const joined = buffer.join('\n').trim();
        buffer = [];
        if (!joined) return;
        // standalone image paragraph -> image block
        const img = joined.match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)$/);
        if (img) {
          const asset = ensureMaterialForImage(img[2], img[1] || `图片 ${out.length + 1}`);
          out.push({ id: makeId('image'), type: 'image', title: img[1] || asset.title, url: asset.displayUrl, assetId: asset.id });
          return;
        }
        out.push({ id: makeId('text'), type: 'text', level: 'p', md: joined });
      };
      for (const rawLine of lines) {
        const line = rawLine;
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          const level = ['h1', 'h2', 'h3'][heading[1].length - 1];
          out.push({ id: makeId('text'), type: 'text', level, md: heading[2].trim() });
          continue;
        }
        if (line.trim() === '') {
          flushParagraph();
          continue;
        }
        buffer.push(line);
      }
      flushParagraph();
      return out;
    }

    // ── blocksToMarkdown(blocks) -> md (contract) ──
    function blocksToMarkdown(list) {
      return (list || [])
        .map(block => {
          if (block.type === 'image') {
            return `![${(block.title || '图片素材').replace(/[\[\]]/g, '')}](${block.url})`;
          }
          const md = String(block.md == null ? '' : block.md).trim();
          if (block.level === 'h1') return `# ${md}`;
          if (block.level === 'h2') return `## ${md}`;
          if (block.level === 'h3') return `### ${md}`;
          return md;
        })
        .filter(part => part && part.trim())
        .join('\n\n');
    }

    function applyDraft(draft, metaText, { autoSave = true } = {}) {
      const safeDraft = draft || { title: '', content: '', images: [], blocks: [], topic: null };
      titleInput.value = safeDraft.title || safeDraft.topic?.title || '';
      sourceTopic = safeDraft.topic || null;
      materials = (safeDraft.images || []).filter(Boolean).map(normalizeImage);
      const rawBlocks = Array.isArray(safeDraft.content_blocks) && safeDraft.content_blocks.length
        ? safeDraft.content_blocks
        : (Array.isArray(safeDraft.blocks) ? safeDraft.blocks : []);
      if (rawBlocks.length) {
        blocks = rawBlocks.map(normalizeBlock);
      } else if (safeDraft.content) {
        // content is Markdown text (DeepSeek output / legacy serialized) -> parse to blocks
        blocks = markdownToBlocks(safeDraft.content);
      } else {
        blocks = [];
      }
      draftMeta.textContent = metaText || '草稿会保存在本机浏览器 localStorage；下次从主页点“继续编辑草稿”或直接打开编辑页会自动载入。';
      renderAll({ autoSave });
    }

    function loadInitialDraft() {
      const imported = localStorage.getItem(IMPORT_KEY);
      const live = localStorage.getItem(LIVE_KEY);
      let draft = null;
      let meta = '';
      if (imported) {
        try { draft = JSON.parse(imported); } catch { draft = null; }
        localStorage.removeItem(IMPORT_KEY);
        currentDraftId = draft && draft.id ? draft.id : null;
        meta = draft?.updated_at ? `已导入刚生成的内容 · ${new Date(draft.updated_at).toLocaleString('zh-CN')}` : '已导入刚生成的内容。';
      }
      if (!draft && live) {
        try { draft = JSON.parse(live); } catch { draft = null; }
        meta = draft?.updated_at ? `已自动载入本地草稿 · ${new Date(draft.updated_at).toLocaleString('zh-CN')}` : '已自动载入本地草稿。';
      }
      applyDraft(draft, meta, { autoSave: Boolean(draft) });
    }

    function loadSavedDraft() {
      const live = localStorage.getItem(LIVE_KEY);
      if (!live) return showToast('暂无可载入的本地草稿');
      let draft = null;
      try { draft = JSON.parse(live); } catch { draft = null; }
      if (!draft) return showToast('本地草稿读取失败');
      applyDraft(draft, `已载入本地草稿 · ${new Date(draft.updated_at || Date.now()).toLocaleString('zh-CN')}`);
      showToast('已载入本地草稿');
    }

    function currentDraft() {
      return {
        title: titleInput.value.trim(),
        content: blocksToMarkdown(blocks),
        content_blocks: blocks,
        blocks,
        topic: sourceTopic,
        images: materials,
        updated_at: new Date().toISOString()
      };
    }

    function saveDraft({ silent = false } = {}) {
      localStorage.setItem(LIVE_KEY, JSON.stringify(currentDraft()));
      if (!silent) showToast('草稿已保存；下次从主页点“继续编辑草稿”可载入');
    }

    async function saveDraftToServer() {
      const name = window.prompt('给这份草稿起个名字', titleInput.value.trim() || '未命名草稿');
      if (name === null) return;
      const title = name.trim() || '未命名草稿';
      const url = currentDraftId ? `/api/drafts/${currentDraftId}` : '/api/drafts';
      const method = currentDraftId ? 'PUT' : 'POST';
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content_blocks: blocks, images: materials })
        });
        const data = await res.json();
        if (!res.ok || !data || !data.success) throw new Error((data && data.error) || '保存失败');
        if (data.draft && data.draft.id) currentDraftId = data.draft.id;
        titleInput.value = title;
        updateDerived();
        showToast('草稿已保存到「草稿管理」');
      } catch (err) {
        showToast('保存失败：' + (err && err.message ? err.message : '请稍后再试'));
      }
    }

    // ── Render blocks INTO the contenteditable preview (preview === editor) ──
    function imageFigureHtml(block) {
      const safeUrl = escapeHtml(block.url);
      const safeTitle = escapeHtml(block.title || '图片素材');
      return `<figure contenteditable="false" data-block-id="${escapeHtml(block.id)}"${block.assetId ? ` data-asset-id="${escapeHtml(block.assetId)}"` : ''}>` +
        `<img src="${safeUrl}" alt="${safeTitle}" referrerpolicy="no-referrer" crossorigin="anonymous" />` +
        `<div class="fig-tools"><button type="button" class="rep" data-fig-action="replace" title="替换图片">替换</button>` +
        `<button type="button" class="del" data-fig-action="delete" title="删除图片">删除</button></div>` +
        `</figure>`;
    }

    function blockToElementHtml(block) {
      if (block.type === 'image') return imageFigureHtml(block);
      const tag = HEADING_LEVELS.has(block.level) ? block.level : 'p';
      const inner = inlineMdToHtml(block.md) || '<br>';
      return `<${tag} data-block-id="${escapeHtml(block.id)}">${inner}</${tag}>`;
    }

    function renderPreview() {
      if (!blocks.length) {
        previewDoc.setAttribute('data-empty', '1');
        previewDoc.innerHTML = '<p data-block-id="' + escapeHtml(makeId('text')) + '"><br></p>';
        return;
      }
      previewDoc.removeAttribute('data-empty');
      previewDoc.innerHTML = blocks.map(blockToElementHtml).join('');
      wireFigureTools();
    }

    function wireFigureTools() {
      previewDoc.querySelectorAll('figure[data-block-id]').forEach(fig => {
        fig.querySelectorAll('[data-fig-action]').forEach(btn => {
          btn.addEventListener('mousedown', e => e.preventDefault());
          btn.addEventListener('click', () => {
            const id = fig.dataset.blockId;
            if (btn.dataset.figAction === 'delete') {
              fig.remove();
              syncBlocksFromDom();
              showToast('已删除图片');
            } else if (btn.dataset.figAction === 'replace') {
              replaceImageBlock(id);
            }
          });
        });
      });
    }

    function replaceImageBlock(blockId) {
      if (!materials.length) return showToast('素材区暂无图片可替换');
      // pick the first material whose id differs, or just the first one
      const block = blocks.find(b => b.id === blockId);
      const next = materials.find(m => m.id !== (block && block.assetId)) || materials[0];
      const fig = previewDoc.querySelector(`figure[data-block-id="${CSS.escape(blockId)}"]`);
      if (!fig || !next) return;
      const img = fig.querySelector('img');
      if (img) { img.src = next.displayUrl; img.alt = next.title; }
      fig.dataset.assetId = next.id;
      syncBlocksFromDom();
      showToast('已替换为：' + next.title);
    }

    // ── Reverse: derive blocks[] from the contenteditable DOM ──
    function syncBlocksFromDom() {
      const next = [];
      Array.from(previewDoc.children).forEach(el => {
        const tag = el.tagName ? el.tagName.toLowerCase() : '';
        if (tag === 'figure') {
          const id = el.dataset.blockId || makeId('image');
          const img = el.querySelector('img');
          const assetId = el.dataset.assetId || null;
          const asset = assetId ? materials.find(m => m.id === assetId) : null;
          const url = (img && img.getAttribute('src')) || (asset && asset.displayUrl) || '';
          if (!url) return;
          next.push({
            id,
            type: 'image',
            title: (img && img.getAttribute('alt')) || (asset && asset.title) || '图片素材',
            url,
            assetId: asset ? asset.id : assetId
          });
          return;
        }
        // text-like element: h1/h2/h3 -> level; everything else -> p (one block per element)
        let level = 'p';
        if (HEADING_LEVELS.has(tag)) level = tag;
        const innerHtml = el.innerHTML;
        const md = inlineHtmlToMd(innerHtml);
        const id = el.dataset.blockId || makeId('text');
        // keep empty paragraphs while editing so caret doesn't jump; drop pure-empty on final serialize
        next.push({ id, type: 'text', level, md });
      });
      blocks = next;
      updateDerived();
    }

    function renderMaterials() {
      if (!materials.length) {
        materialGrid.innerHTML = '<div class="empty">暂无素材。生成图片会自动出现在这里，也可以导入本地图片。</div>';
        return;
      }
      materialGrid.innerHTML = materials.map(asset => `
        <div class="material-card" draggable="true" data-asset-id="${escapeHtml(asset.id)}">
          <img src="${escapeHtml(asset.displayUrl)}" alt="${escapeHtml(asset.title)}" referrerpolicy="no-referrer" />
          <div class="material-info">
            <div class="material-title">${escapeHtml(asset.title)} · ${escapeHtml(asset.source)}</div>
            <button class="btn" data-insert="${escapeHtml(asset.id)}">插入预览</button>
          </div>
        </div>
      `).join('');
      materialGrid.querySelectorAll('[data-insert]').forEach(btn => {
        btn.addEventListener('click', () => {
          const asset = materials.find(item => item.id === btn.dataset.insert);
          if (asset) insertImageAtCaret(asset);
        });
      });
      materialGrid.querySelectorAll('[data-asset-id]').forEach(card => {
        card.addEventListener('dragstart', event => {
          event.dataTransfer.setData('application/x-hotstream-asset', card.dataset.assetId);
          event.dataTransfer.effectAllowed = 'copy';
        });
      });
    }

    function updateDerived({ autoSave = true } = {}) {
      const md = blocksToMarkdown(blocks);
      if (markdownSource) markdownSource.value = md;
      const count = blocks
        .filter(block => block.type === 'text')
        .map(block => inlineHtmlToMd(inlineMdToHtml(block.md)) || String(block.md || ''))
        .join('')
        .replace(/[*_#`~>\-\[\]()!]/g, '')
        .replace(/\s+/g, '').length;
      wordCount.textContent = `${count.toLocaleString('zh-CN')} 字`;
      if (autoSave) saveDraft({ silent: true });
    }

    function renderAll(options = {}) {
      renderPreview();
      renderMaterials();
      updateDerived(options);
    }

    // ── Selection helpers (so toolbar buttons can act on the last caret) ──
    function rememberSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount && previewDoc.contains(sel.anchorNode)) {
        savedSelection = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreSelection() {
      if (!savedSelection) { previewDoc.focus(); return; }
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedSelection);
    }

    function currentBlockElement() {
      const sel = window.getSelection();
      let node = (sel && sel.rangeCount && previewDoc.contains(sel.anchorNode)) ? sel.anchorNode : null;
      if (!node && savedSelection) node = savedSelection.startContainer;
      if (!node) return null;
      if (node.nodeType === 3) node = node.parentNode;
      while (node && node.parentNode !== previewDoc && node !== previewDoc) node = node.parentNode;
      return (node && node !== previewDoc) ? node : null;
    }

    function setBlockLevel(level) {
      const el = currentBlockElement();
      if (!el || el.tagName.toLowerCase() === 'figure') { showToast('请把光标放在文字段落上'); return; }
      const tag = HEADING_LEVELS.has(level) ? level : 'p';
      if (el.tagName.toLowerCase() === tag) return;
      const replacement = document.createElement(tag);
      replacement.innerHTML = el.innerHTML || '<br>';
      if (el.dataset.blockId) replacement.dataset.blockId = el.dataset.blockId;
      el.replaceWith(replacement);
      // restore caret at end of the replacement
      const range = document.createRange();
      range.selectNodeContents(replacement);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      syncBlocksFromDom();
    }

    function syncToolbarFromSelection() {
      const el = currentBlockElement();
      if (el && el.tagName) {
        const tag = el.tagName.toLowerCase();
        blockLevelSelect.value = HEADING_LEVELS.has(tag) ? tag : 'p';
      }
      ['bold', 'italic', 'underline'].forEach(cmd => {
        const btn = document.querySelector(`.rt-btn[data-cmd="${cmd}"]`);
        if (!btn) return;
        let active = false;
        try { active = document.queryCommandState(cmd); } catch (e) {}
        btn.dataset.active = active ? '1' : '0';
      });
    }

    function execInline(cmd, value) {
      restoreSelection();
      try { document.execCommand(cmd, false, value); } catch (e) {}
      rememberSelection();
      syncBlocksFromDom();
      syncToolbarFromSelection();
    }

    // ── Insert an image figure at the caret position ──
    function figureNodeFor(asset) {
      const block = { id: makeId('image'), type: 'image', title: asset.title, url: asset.displayUrl, assetId: asset.id };
      const wrap = document.createElement('div');
      wrap.innerHTML = imageFigureHtml(block);
      return wrap.firstElementChild;
    }

    function insertImageAtCaret(asset) {
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      const fig = figureNodeFor(asset);
      restoreSelection();
      const sel = window.getSelection();
      let blockEl = currentBlockElement();
      if (blockEl && blockEl !== previewDoc) {
        blockEl.after(fig);
      } else {
        previewDoc.appendChild(fig);
      }
      // place a fresh empty paragraph after the figure so user can keep typing
      const after = document.createElement('p');
      after.innerHTML = '<br>';
      fig.after(after);
      const range = document.createRange();
      range.selectNodeContents(after);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      wireFigureTools();
      syncBlocksFromDom();
      showToast('素材已插入预览');
    }

    function appendParagraph() {
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      p.dataset.blockId = makeId('text');
      previewDoc.appendChild(p);
      const range = document.createRange();
      range.selectNodeContents(p);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      previewDoc.focus();
      syncBlocksFromDom();
    }

    function addFiles(files) {
      Array.from(files || []).forEach((file, index) => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => {
          materials.unshift({
            id: makeId(`upload-${index}`),
            title: file.name.replace(/\.[^.]+$/, ''),
            originalUrl: reader.result,
            displayUrl: reader.result,
            source: '本地导入'
          });
          renderMaterials();
          updateDerived();
          showToast('图片已加入素材区');
        };
        reader.readAsDataURL(file);
      });
    }

    // ── Export long image with html2canvas (faithful style render) ──
    async function exportLongImage() {
      if (!blocks.length) return showToast('没有可导出的正文');
      if (typeof html2canvas === 'undefined') return showToast('导出库未加载，请刷新后再试');
      const title = titleInput.value.trim() || 'HotStream 文案';
      const preset = presets[document.getElementById('platformPreset').value] || presets.xhs;

      // Build a clean clone of the styled preview (strip editing chrome).
      const clone = previewDoc.cloneNode(true);
      clone.removeAttribute('contenteditable');
      clone.removeAttribute('id');
      clone.removeAttribute('data-empty');
      clone.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
      clone.querySelectorAll('.fig-tools').forEach(n => n.remove());

      // Prepend the title + source as styled nodes (kept out of the editable body).
      if (sourceTopic) {
        const src = document.createElement('div');
        src.className = 'source';
        const hot = sourceTopic.hot_value ? ` · 热度 ${Number(sourceTopic.hot_value).toLocaleString('zh-CN')}` : '';
        src.textContent = `来源：${sourceTopic.source || ''}${hot}`;
        clone.insertBefore(src, clone.firstChild);
      }
      if (title && !clone.querySelector('h1')) {
        const h = document.createElement('h1');
        h.textContent = title;
        clone.insertBefore(h, clone.firstChild);
      }

      // Stage off-screen at the platform width so wrapping matches the export size.
      const stage = document.createElement('div');
      stage.style.cssText = 'position:fixed;left:-99999px;top:0;z-index:-1;';
      const docWidth = Math.round(preset.width / 1.86); // preview-doc max ~580px maps to 1080 export
      clone.style.width = docWidth + 'px';
      clone.style.maxWidth = 'none';
      clone.style.margin = '0';
      clone.style.boxShadow = 'none';
      clone.style.background = '#ffffff';
      stage.appendChild(clone);
      document.body.appendChild(stage);

      try {
        const canvas = await html2canvas(clone, {
          useCORS: true,
          scale: 2,
          backgroundColor: '#ffffff',
          logging: false
        });
        const link = document.createElement('a');
        const safeTitle = title.replace(/[^0-9A-Za-z一-鿿_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'hotstream-long-image';
        link.download = `${safeTitle}.png`;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('长图已导出');
      } catch (err) {
        showToast('导出失败：' + (err && err.message ? err.message : '请稍后再试'));
      } finally {
        stage.remove();
      }
    }

    // ── Wire up the contenteditable preview ──
    let inputTimer = null;
    previewDoc.addEventListener('input', () => {
      previewDoc.removeAttribute('data-empty');
      clearTimeout(inputTimer);
      inputTimer = setTimeout(() => {
        syncBlocksFromDom();
      }, 320);
    });
    previewDoc.addEventListener('keyup', () => { rememberSelection(); syncToolbarFromSelection(); });
    previewDoc.addEventListener('mouseup', () => { rememberSelection(); syncToolbarFromSelection(); });
    previewDoc.addEventListener('focus', rememberSelection);
    previewDoc.addEventListener('blur', () => { rememberSelection(); syncBlocksFromDom(); });
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === previewDoc) { rememberSelection(); }
    });

    // Accept dropped materials into the editable preview.
    previewDoc.addEventListener('dragover', event => {
      if (event.dataTransfer && Array.from(event.dataTransfer.types || []).includes('application/x-hotstream-asset')) {
        event.preventDefault();
      }
    });
    previewDoc.addEventListener('drop', event => {
      const assetId = event.dataTransfer.getData('application/x-hotstream-asset');
      if (!assetId) return;
      event.preventDefault();
      const asset = materials.find(item => item.id === assetId);
      if (!asset) return;
      // place caret at drop point if possible
      const range = (document.caretRangeFromPoint && document.caretRangeFromPoint(event.clientX, event.clientY))
        || (document.caretPositionFromPoint && (() => {
            const pos = document.caretPositionFromPoint(event.clientX, event.clientY);
            if (!pos) return null;
            const r = document.createRange();
            r.setStart(pos.offsetNode, pos.offset);
            r.collapse(true);
            return r;
          })());
      if (range) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelection = range.cloneRange();
      }
      insertImageAtCaret(asset);
    });

    // ── Toolbar wiring ──
    blockLevelSelect.addEventListener('mousedown', rememberSelection);
    blockLevelSelect.addEventListener('change', () => setBlockLevel(blockLevelSelect.value));

    document.querySelectorAll('.rt-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', event => { event.preventDefault(); rememberSelection(); });
      btn.addEventListener('click', () => execInline(btn.dataset.cmd));
    });

    const foreColorInput = document.getElementById('foreColor');
    foreColorInput.addEventListener('mousedown', rememberSelection);
    foreColorInput.addEventListener('input', () => execInline('foreColor', foreColorInput.value));

    const fontNameSelect = document.getElementById('fontName');
    fontNameSelect.addEventListener('mousedown', rememberSelection);
    fontNameSelect.addEventListener('change', () => {
      if (fontNameSelect.value) execInline('fontName', fontNameSelect.value);
    });

    document.getElementById('toolbarInsertImage').addEventListener('mousedown', e => e.preventDefault());
    document.getElementById('toolbarInsertImage').addEventListener('click', () => {
      if (!materials.length) return showToast('素材区暂无图片；先在右侧导入或等待生成图');
      restoreSelection();
      insertImageAtCaret(materials[0]);
    });

    titleInput.addEventListener('input', () => updateDerived());
    document.getElementById('platformPreset').addEventListener('change', () => {});
    document.getElementById('assetUpload').addEventListener('change', (event) => addFiles(event.target.files));
    document.getElementById('addParagraphBtn').addEventListener('click', appendParagraph);
    document.getElementById('loadDraftBtn').addEventListener('click', () => { window.location.href = '/drafts'; });
    document.getElementById('saveDraftBtn').addEventListener('click', () => saveDraftToServer());
    document.getElementById('exportImageBtn').addEventListener('click', exportLongImage);
    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = '/app'; });
    document.getElementById('clearDraftBtn').addEventListener('click', () => {
      if (!confirm('确定清空当前编辑页草稿吗？')) return;
      titleInput.value = '';
      blocks = [];
      materials = [];
      sourceTopic = null;
      savedSelection = null;
      localStorage.removeItem(LIVE_KEY);
      localStorage.removeItem(IMPORT_KEY);
      renderAll({ autoSave: false });
      showToast('已清空编辑页');
    });

    loadInitialDraft();

    // ── Current-user bar (injected by the Next.js auth layer) ──
    (async function userBar() {
      try {
        const r = await fetch('/api/auth/me', { cache: 'no-store' });
        const d = await r.json();
        if (!d || !d.success) return;
        const name = d.user.displayName || d.user.username;
        const userSvg = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        const usersSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
        const outSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>';
        const draftSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>';
        const bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;top:12px;right:16px;z-index:9999;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text-2);background:var(--surface);backdrop-filter:blur(6px);padding:6px 12px;border:1px solid var(--border-strong);border-radius:999px;box-shadow:var(--shadow-menu);';
        const who = document.createElement('span');
        who.style.cssText = 'display:inline-flex;align-items:center;gap:6px;';
        who.innerHTML = userSvg + ' ' + escapeHtml(name);
        bar.appendChild(who);
        if (d.user.role === 'admin') {
          const a = document.createElement('a');
          a.href = '/admin/users';
          a.innerHTML = usersSvg + ' 用户管理';
          a.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;';
          bar.appendChild(a);
        }
        const drafts = document.createElement('a');
        drafts.href = '/drafts';
        drafts.innerHTML = draftSvg + ' 草稿';
        drafts.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(drafts);
        const bookSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
        const knowledge = document.createElement('a');
        knowledge.href = '/knowledge';
        knowledge.innerHTML = bookSvg + ' 知识库';
        knowledge.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(knowledge);
        const presetSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>';
        const presetsLink = document.createElement('a');
        presetsLink.href = '/presets';
        presetsLink.innerHTML = presetSvg + ' 预设';
        presetsLink.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(presetsLink);
        const gearSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>';
        const profile = document.createElement('a');
        profile.href = '/profile';
        profile.innerHTML = gearSvg + ' 设置';
        profile.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(profile);
        const out = document.createElement('button');
        out.innerHTML = outSvg + ' 登出';
        out.style.cssText = 'display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;';
        out.onclick = async () => { try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {} location.href = '/login'; };
        bar.appendChild(out);
        const sunSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
        const moonSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
        const themeBtn = document.createElement('button');
        themeBtn.title = '切换日间/夜间模式';
        themeBtn.setAttribute('aria-label', '切换日间/夜间模式');
        themeBtn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--accent-warm);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;';
        function updateThemeIcon() {
          themeBtn.innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? moonSvg : sunSvg;
        }
        updateThemeIcon();
        themeBtn.onclick = function() {
          var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('hotstream.theme', next); } catch(e) {}
          document.documentElement.classList.add('theme-anim');
          setTimeout(function() { document.documentElement.classList.remove('theme-anim'); }, 350);
          updateThemeIcon();
        };
        bar.appendChild(themeBtn);
        document.body.appendChild(bar);
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>

    // ── 分页符删除：点击选中（红色高亮）→ Backspace/Delete 删除；
    //    或光标在分页符后块的起始处 Backspace 也删除其前的分页符。 ──
    let selectedPageBreak = null;
    function clearSelectedPageBreak() {
      if (selectedPageBreak) selectedPageBreak.classList.remove('selected');
      selectedPageBreak = null;
    }
    previewDoc.addEventListener('click', event => {
      const hr = event.target.closest ? event.target.closest('hr.pagebreak,[data-pagebreak]') : null;
      if (hr && previewDoc.contains(hr)) {
        clearSelectedPageBreak();
        selectedPageBreak = hr;
        hr.classList.add('selected');
      } else {
        clearSelectedPageBreak();
      }
    });
    previewDoc.addEventListener('keydown', event => {
      if (event.key !== 'Backspace' && event.key !== 'Delete') {
        if (selectedPageBreak) clearSelectedPageBreak();
        return;
      }
      // 1) 已选中某分页符 → 直接删它
      if (selectedPageBreak && previewDoc.contains(selectedPageBreak)) {
        event.preventDefault();
        const hr = selectedPageBreak;
        clearSelectedPageBreak();
        hr.remove();
        syncBlocksFromDom();
        showToast('已删除分页符');
        return;
      }
      // 2) 光标在某块最开头按 Backspace，且其前一个兄弟是分页符 → 删该分页符
      if (event.key === 'Backspace') {
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount || !sel.isCollapsed) return;
        const range = sel.getRangeAt(0);
        if (range.startOffset !== 0) return;
        const blockEl = topLevelBlockFromNode(range.startContainer);
        if (!blockEl) return;
        const prev = blockEl.previousElementSibling;
        if (prev && (prev.classList?.contains('pagebreak') || prev.hasAttribute('data-pagebreak'))) {
          event.preventDefault();
          prev.remove();
          syncBlocksFromDom();
          showToast('已删除分页符');
        }
      }
    });

    // 取放置点对应的 caret Range（跨浏览器）
    function caretRangeFromPoint(x, y) {
      if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
      if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(x, y);
        if (!pos) return null;
        const r = document.createRange();
        r.setStart(pos.offsetNode, pos.offset);
        r.collapse(true);
        return r;
      }
      return null;
    }

    // 从一个 DOM 节点向上找到 previewDoc 的直接子块
    function topLevelBlockFromNode(node) {
      if (!node) return null;
      if (node.nodeType === 3) node = node.parentNode;
      while (node && node.parentNode !== previewDoc && node !== previewDoc) node = node.parentNode;
      return (node && node !== previewDoc) ? node : null;
    }

    // Accept dropped materials (copy) or moved figures (move) into the editable preview.
    previewDoc.addEventListener('dragover', event => {
      const types = event.dataTransfer ? Array.from(event.dataTransfer.types || []) : [];
      if (types.includes(MOVE_MIME) || draggedFigure) {
        event.preventDefault();
        try { event.dataTransfer.dropEffect = 'move'; } catch (e) {}
      } else if (types.includes(ASSET_MIME)) {
        event.preventDefault();
        try { event.dataTransfer.dropEffect = 'copy'; } catch (e) {}
      }
    });
    previewDoc.addEventListener('drop', event => {
      const types = event.dataTransfer ? Array.from(event.dataTransfer.types || []) : [];
      // ── 移动正文内已有图片（不复制）──
      if (types.includes(MOVE_MIME) || draggedFigure) {
        event.preventDefault(); // 阻止 contenteditable 默认的图片复制
        const fig = draggedFigure;
        draggedFigure = null;
        if (!fig) return;
        fig.classList.remove('dragging');
        const range = caretRangeFromPoint(event.clientX, event.clientY);
        let target = range ? topLevelBlockFromNode(range.startContainer) : null;
        // 放在自身上 / 找不到目标：不动
        if (!target || target === fig) { syncBlocksFromDom(); return; }
        // 把被拖 figure 移动到目标块之后（DOM 中先移除再插入，保证只剩一份）
        target.after(fig);
        wireFigureTools();
        syncBlocksFromDom();
        showToast('已移动图片');
        return;
      }
      // ── 从素材区拖入（复制，插入新图）──
      const assetId = event.dataTransfer.getData(ASSET_MIME);
      if (!assetId) return;
      event.preventDefault();
      const asset = materials.find(item => item.id === assetId);
      if (!asset) return;
      const range = caretRangeFromPoint(event.clientX, event.clientY);
      if (range) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelection = range.cloneRange();
      }
      insertImageAtCaret(asset);
    });

    // ── Toolbar wiring ──
    blockLevelSelect.addEventListener('mousedown', rememberSelection);
    blockLevelSelect.addEventListener('change', () => setBlockLevel(blockLevelSelect.value));

    document.querySelectorAll('.rt-btn[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', event => { event.preventDefault(); rememberSelection(); });
      btn.addEventListener('click', () => execInline(btn.dataset.cmd));
    });

    // ── 颜色一键应用 + 最近颜色预设（≤5，FIFO，持久化）──
    const COLOR_KEY = 'hotstream.editorColor';
    const COLOR_PRESETS_KEY = 'hotstream.editorColorPresets';
    const COLOR_PRESETS_MAX = 5;
    const colorApplyBtn = document.getElementById('colorApply');
    const colorSwatch = document.getElementById('colorSwatch');
    const colorPresetsEl = document.getElementById('colorPresets');
    const foreColorInput = document.getElementById('foreColor');

    let currentColor = '#e11d48';
    let colorPresets = [];
    try {
      const c = localStorage.getItem(COLOR_KEY);
      if (c) currentColor = c;
      const p = JSON.parse(localStorage.getItem(COLOR_PRESETS_KEY) || '[]');
      if (Array.isArray(p)) colorPresets = p.filter(x => typeof x === 'string').slice(0, COLOR_PRESETS_MAX);
    } catch (e) {}

    function persistColors() {
      try {
        localStorage.setItem(COLOR_KEY, currentColor);
        localStorage.setItem(COLOR_PRESETS_KEY, JSON.stringify(colorPresets));
      } catch (e) {}
    }

    function setCurrentColor(color) {
      currentColor = color;
      if (colorSwatch) colorSwatch.style.background = color;
      if (foreColorInput) foreColorInput.value = color;
      persistColors();
    }

    // 把一个颜色加入预设：重复则提到最前；超过 5 个 FIFO 移除最早的。
    function pushPreset(color) {
      const idx = colorPresets.indexOf(color);
      if (idx !== -1) colorPresets.splice(idx, 1);
      colorPresets.push(color);
      while (colorPresets.length > COLOR_PRESETS_MAX) colorPresets.shift();
      persistColors();
      renderColorPresets();
    }

    function renderColorPresets() {
      colorPresetsEl.innerHTML = colorPresets.map(c =>
        `<button type="button" class="rt-color-preset" data-color="${escapeHtml(c)}" style="background:${escapeHtml(c)}" title="应用 ${escapeHtml(c)}" aria-label="应用颜色 ${escapeHtml(c)}"></button>`
      ).join('');
      colorPresetsEl.querySelectorAll('.rt-color-preset').forEach(btn => {
        btn.addEventListener('mousedown', e => { e.preventDefault(); rememberSelection(); });
        btn.addEventListener('click', () => {
          const color = btn.dataset.color;
          execInline('foreColor', color);
          setCurrentColor(color);
        });
      });
    }

    // 主「颜色」按钮：点击即把 currentColor 应用到选区
    colorApplyBtn.addEventListener('mousedown', e => { e.preventDefault(); rememberSelection(); });
    colorApplyBtn.addEventListener('click', () => execInline('foreColor', currentColor));

    // 自定义/+ 入口：选了新颜色 → 应用 + 设为当前 + 入预设
    foreColorInput.addEventListener('mousedown', rememberSelection);
    foreColorInput.addEventListener('input', () => {
      const color = foreColorInput.value;
      execInline('foreColor', color);
      setCurrentColor(color);
      pushPreset(color);
    });

    setCurrentColor(currentColor);
    renderColorPresets();

    // ── 格式刷（仿 Word 单次）：捕获当前格式 → 选中目标文字后逐项应用 ──
    const formatPainterBtn = document.getElementById('formatPainter');
    let painterFormat = null; // { bold, italic, underline, color, font } | null

    function normalizeColorValue(v) {
      // queryCommandValue('foreColor') 可能返回 rgb(...) 或 #hex；统一成可用于 foreColor 的字符串
      if (!v) return '';
      const s = String(v).trim();
      if (!s || s === 'rgb(0, 0, 0)') return s; // 黑色也照样应用
      return s;
    }

    function capturePainterFormat() {
      restoreSelection();
      let bold = false, italic = false, underline = false, color = '', font = '';
      try { bold = document.queryCommandState('bold'); } catch (e) {}
      try { italic = document.queryCommandState('italic'); } catch (e) {}
      try { underline = document.queryCommandState('underline'); } catch (e) {}
      try { color = normalizeColorValue(document.queryCommandValue('foreColor')); } catch (e) {}
      try { font = String(document.queryCommandValue('fontName') || '').replace(/^["']|["']$/g, ''); } catch (e) {}
      return { bold, italic, underline, color, font };
    }

    function setPainterActive(on) {
      formatPainterBtn.dataset.active = on ? '1' : '0';
      formatPainterBtn.classList.toggle('painting', on);
      previewDoc.classList.toggle('painting', on);
    }

    function exitPainter() {
      painterFormat = null;
      setPainterActive(false);
    }

    function applyPainterFormat(fmt) {
      // 逐项应用：B/I/U 仅在需要开启时切换（queryCommandState 为 false 才 toggle 开）
      restoreSelection();
      try {
        if (fmt.bold && !document.queryCommandState('bold')) document.execCommand('bold', false, null);
        if (fmt.italic && !document.queryCommandState('italic')) document.execCommand('italic', false, null);
        if (fmt.underline && !document.queryCommandState('underline')) document.execCommand('underline', false, null);
        if (fmt.color) document.execCommand('foreColor', false, fmt.color);
        if (fmt.font) document.execCommand('fontName', false, fmt.font);
      } catch (e) {}
      rememberSelection();
      syncBlocksFromDom();
      syncToolbarFromSelection();
    }

    formatPainterBtn.addEventListener('mousedown', e => { e.preventDefault(); rememberSelection(); });
    formatPainterBtn.addEventListener('click', () => {
      if (painterFormat) { exitPainter(); return; } // 再点一次取消
      painterFormat = capturePainterFormat();
      setPainterActive(true);
      showToast('格式刷已就绪：选中目标文字即可套用格式');
    });

    // 选中目标文字（mouseup 得到非空选区）后套用并退出刷格式态
    previewDoc.addEventListener('mouseup', () => {
      if (!painterFormat) return;
      const sel = window.getSelection();
      if (sel && sel.rangeCount && !sel.isCollapsed && previewDoc.contains(sel.anchorNode)) {
        const fmt = painterFormat;
        rememberSelection();
        applyPainterFormat(fmt);
        exitPainter();
        showToast('已套用格式');
      }
    });

    // Esc 退出刷格式态
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && painterFormat) exitPainter();
    });

    // ── 分页符按钮 ──
    const insertPageBreakBtn = document.getElementById('insertPageBreak');
    insertPageBreakBtn.addEventListener('mousedown', e => { e.preventDefault(); rememberSelection(); });
    insertPageBreakBtn.addEventListener('click', insertPageBreak);

    // ── AI 帮写（扩写 / 缩写 / 改写 / 补充）：选区态作用于非空选区；光标态可补充 ──
    const aiAssistBtn = document.getElementById('aiAssistBtn');
    const aiAssistMenu = document.getElementById('aiAssistMenu');
    const aiRewriteBox = document.getElementById('aiRewriteBox');
    const aiRewriteReq = document.getElementById('aiRewriteReq');
    const aiRewriteGo = document.getElementById('aiRewriteGo');
    const aiRewriteCancel = document.getElementById('aiRewriteCancel');
    const aiSupplementBox = document.getElementById('aiSupplementBox');
    const aiSupplementReq = document.getElementById('aiSupplementReq');
    const aiSupplementGo = document.getElementById('aiSupplementGo');
    const aiSupplementCancel = document.getElementById('aiSupplementCancel');
    const aiProgress = document.getElementById('aiProgress');
    const aiProgressFill = document.getElementById('aiProgressFill');
    const aiProgressSteps = document.getElementById('aiProgressSteps');
    // 对比预览浮层
    const aiCompare = document.getElementById('aiCompare');
    const aiCompareBackdrop = document.getElementById('aiCompareBackdrop');
    const aiCompareTitle = document.getElementById('aiCompareTitle');
    const aiCompareBadge = document.getElementById('aiCompareBadge');
    const aiCompareOrig = document.getElementById('aiCompareOrig');
    const aiCompareOrigHead = document.getElementById('aiCompareOrigHead');
    const aiCompareResult = document.getElementById('aiCompareResult');
    const aiCompareResultHead = document.getElementById('aiCompareResultHead');
    const aiCompareHint = document.getElementById('aiCompareHint');
    const aiCompareAccept = document.getElementById('aiCompareAccept');
    const aiCompareDiscard = document.getElementById('aiCompareDiscard');
    let aiBusy = false;
    // 持久选中高亮记录：被包裹的文字 span 与被描边的 figure（供清除/回填用）
    let aiHighlight = null; // { spans:[<span.ai-sel>], figures:[<figure.ai-sel>] }
    let aiSuppressHighlightClear = false; // 高亮自身改动 DOM 时，避免 selectionchange 误清
    let aiIgnoreSelChange = 0; // 铺设高亮后，DOM 变动会异步触发 selectionchange，吞掉若干次避免误清
    let aiCompareState = null; // { mode, resultMd, requirement, captured } 待接受的预览态
    let aiSupplementPreviewEl = null; // 补充模式：文档内「模拟插入」的虚线框容器

    // 把 /api/proxy-image?url=<原图> 还原成原始 url，便于 Qwen 直接读取外链；
    // data: 或本身就是外链则原样返回。
    function unproxyImageUrl(url) {
      const raw = String(url || '');
      if (!raw) return '';
      const m = raw.match(/[?&]url=([^&]+)/);
      if (raw.indexOf('/api/proxy-image') !== -1 && m) {
        try { return decodeURIComponent(m[1]); } catch (e) { return raw; }
      }
      return raw;
    }

    // ── 持久选中高亮 ─────────────────────────────────────────────────────────
    // 把当前（或记忆的）选区内的文字片段用 <span class="ai-sel"> 包裹、选区内的
    // figure 加 .ai-sel 描边；记录到 aiHighlight，即使浏览器原生选区消失也保持显示。
    function clearAiHighlight() {
      if (!aiHighlight) return;
      aiSuppressHighlightClear = true;
      (aiHighlight.spans || []).forEach(span => {
        if (!span.parentNode) return;
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        parent.normalize && parent.normalize();
      });
      (aiHighlight.figures || []).forEach(fig => { if (fig) fig.classList.remove('ai-sel'); });
      aiHighlight = null;
      aiSuppressHighlightClear = false;
    }

    // 在给定 range 上铺设持久高亮。返回是否成功（有可高亮内容）。
    function applyAiHighlight(range) {
      clearAiHighlight();
      if (!range || range.collapsed || !previewDoc.contains(range.commonAncestorContainer)) return false;
      aiSuppressHighlightClear = true;
      const spans = [];
      const figures = [];
      // 1) 收集与 range 相交的文字节点（避开 figure/img 内部）。
      const walker = document.createTreeWalker(previewDoc, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
          if (!range.intersectsNode(node)) return NodeFilter.FILTER_REJECT;
          // 跳过 figure（图片块）内部的文字（如替换/删除按钮文案）
          let p = node.parentNode;
          while (p && p !== previewDoc) { if (p.nodeName === 'FIGURE') return NodeFilter.FILTER_REJECT; p = p.parentNode; }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const textNodes = [];
      let tn;
      while ((tn = walker.nextNode())) textNodes.push(tn);
      // 2) 对每个相交文字节点，按 range 边界切出需要高亮的部分并包 span。
      textNodes.forEach(node => {
        let start = 0, end = node.nodeValue.length;
        if (node === range.startContainer) start = range.startOffset;
        if (node === range.endContainer) end = range.endOffset;
        if (end <= start) return;
        // 用 splitText 把待高亮片段切成独立文字节点：先切尾、再切头。
        let target = node;
        if (end < target.nodeValue.length) target.splitText(end);
        if (start > 0) target = target.splitText(start);
        if (target.nodeValue.length === 0) return;
        const span = document.createElement('span');
        span.className = 'ai-sel';
        target.parentNode.insertBefore(span, target);
        span.appendChild(target);
        spans.push(span);
      });
      // 3) 选区内的 figure 加描边角标。
      previewDoc.querySelectorAll('figure[data-block-id]').forEach(fig => {
        if (range.intersectsNode(fig)) { fig.classList.add('ai-sel'); figures.push(fig); }
      });
      aiSuppressHighlightClear = false;
      if (!spans.length && !figures.length) { aiHighlight = null; return false; }
      aiHighlight = { spans, figures };
      // 铺设高亮会折叠/改动原生选区，浏览器随后异步派发 selectionchange；
      // 吞掉接下来的一次，避免「我们自己改 DOM」被当成「用户重新选择」而清除高亮。
      aiIgnoreSelChange = 1;
      return true;
    }

    // 从持久高亮反推「待处理选区」内容（替换的源就是高亮本身，与原生选区解耦）。
    // 返回 {markdown, images[], firstNode, lastNode}；firstNode/lastNode 用于定位替换范围。
    function captureFromHighlight() {
      if (!aiHighlight) return null;
      const ordered = [];
      (aiHighlight.spans || []).forEach(n => ordered.push(n));
      (aiHighlight.figures || []).forEach(n => ordered.push(n));
      if (!ordered.length) return null;
      // 按文档顺序排序，确定首/尾节点。
      ordered.sort((a, b) => {
        if (a === b) return 0;
        const rel = a.compareDocumentPosition(b);
        return (rel & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
      });
      const firstNode = ordered[0];
      const lastNode = ordered[ordered.length - 1];
      // 文字 markdown：把高亮 span 的内联 HTML 串起来（剥掉 .ai-sel 包裹自身）。
      const holder = document.createElement('div');
      (aiHighlight.spans || []).forEach(span => {
        const clone = span.cloneNode(true);
        // 把 span 内容直接搬出，避免 .ai-sel 进入 markdown
        while (clone.firstChild) holder.appendChild(clone.firstChild);
      });
      const markdown = inlineHtmlToMd(holder.innerHTML);
      // 图片 url（去重、还原代理）
      const images = [];
      (aiHighlight.figures || []).forEach(fig => {
        const img = fig.querySelector('img');
        const src = img ? unproxyImageUrl(img.getAttribute('src') || '') : '';
        if (src && images.indexOf(src) === -1) images.push(src);
      });
      const preservedFigures = (aiHighlight.figures || []).map(f => f.outerHTML);
      return { markdown, images, firstNode, lastNode, preservedFigures };
    }

    // 当前 previewDoc 内是否存在非空选区（决定「AI 帮写」选区态）。
    function previewHasSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount && !sel.isCollapsed && previewDoc.contains(sel.anchorNode) && previewDoc.contains(sel.focusNode)) {
        return !sel.getRangeAt(0).collapsed;
      }
      // 失焦后用记忆的选区兜底
      if (savedSelection && !savedSelection.collapsed && previewDoc.contains(savedSelection.startContainer)) {
        return true;
      }
      // 已铺设的持久高亮也算「有选区」（原生选区消失后仍可操作）。
      if (aiHighlight) return true;
      return false;
    }

    // 当前是否处于「光标态」（无选区，光标在 previewDoc 内）—— 补充仅在此态可用。
    function previewHasCaret() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount && sel.isCollapsed && previewDoc.contains(sel.anchorNode)) return true;
      if (savedSelection && savedSelection.collapsed && previewDoc.contains(savedSelection.startContainer)) return true;
      return false;
    }

    function refreshAiAvailability() {
      // AI 帮写按钮：有选区、有持久高亮、或有光标（补充态）任一即可用。
      const ok = (previewHasSelection() || previewHasCaret()) && !aiBusy;
      aiAssistBtn.disabled = !ok;
      if (!ok && aiAssistMenu.hidden === false) closeAiMenu();
    }

    function syncAiMenuModes() {
      // 选区态：扩/缩/改可用、补充禁用；光标态：仅补充可用。
      const hasSel = previewHasSelection();
      aiAssistMenu.querySelectorAll('.rt-ai-item').forEach(item => {
        const m = item.dataset.aiMode;
        const allowed = (m === 'supplement') ? !hasSel : hasSel;
        item.disabled = !allowed || aiBusy;
        item.setAttribute('aria-disabled', (!allowed).toString());
      });
    }

    function closeAiMenu() {
      aiAssistMenu.hidden = true;
      aiAssistBtn.setAttribute('aria-expanded', 'false');
      aiRewriteBox.hidden = true;
      aiSupplementBox.hidden = true;
      if (!aiBusy) hideAiProgress();
    }

    function openAiMenu() {
      if (aiAssistBtn.disabled) return;
      // 打开菜单即「锁定作用对象」：把当前选区铺成持久高亮（光标态则不铺）。
      rememberSelection();
      if (previewHasSelection()) {
        const r = (savedSelection && !savedSelection.collapsed) ? savedSelection : (window.getSelection().rangeCount ? window.getSelection().getRangeAt(0) : null);
        if (r && !r.collapsed) applyAiHighlight(r.cloneRange());
      }
      aiAssistMenu.hidden = false;
      aiAssistBtn.setAttribute('aria-expanded', 'true');
      aiRewriteBox.hidden = true;
      aiSupplementBox.hidden = true;
      syncAiMenuModes();
    }

    // ── 进度条 ──────────────────────────────────────────────────────────────
    function showAiProgress(withImages) {
      aiProgress.hidden = false;
      const imgStep = aiProgressSteps.querySelector('[data-step="analyzing_images"]');
      if (imgStep) imgStep.hidden = !withImages; // 仅 rewrite+图片才出现「分析图片」步
      aiProgressSteps.querySelectorAll('.ai-progress-step').forEach(s => s.setAttribute('data-state', 'pending'));
      aiProgressFill.style.right = '100%';
    }
    function hideAiProgress() {
      aiProgress.hidden = true;
      aiProgressFill.style.right = '100%';
    }
    // 依据收到的 phase 切换步骤态与进度条。
    function setAiPhase(phase) {
      const order = ['analyzing_images', 'generating', 'done'];
      const stepEl = name => aiProgressSteps.querySelector('[data-step="' + name + '"]');
      if (phase === 'analyzing_images') {
        stepEl('analyzing_images').setAttribute('data-state', 'active');
        aiProgressFill.style.right = '66%';
        showToast('正在分析图片…');
      } else if (phase === 'image_failed') {
        const s = stepEl('analyzing_images'); if (s) s.setAttribute('data-state', 'failed');
      } else if (phase === 'generating') {
        const ai = stepEl('analyzing_images');
        if (ai && !ai.hidden && ai.getAttribute('data-state') !== 'failed') ai.setAttribute('data-state', 'done');
        stepEl('generating').setAttribute('data-state', 'active');
        aiProgressFill.style.right = '33%';
        showToast('正在生成文案…');
      } else if (phase === 'done') {
        const g = stepEl('generating'); if (g) g.setAttribute('data-state', 'done');
        stepEl('done').setAttribute('data-state', 'done');
        aiProgressFill.style.right = '0%';
        showToast('生成完成');
      }
    }

    // 把 AI 返回的 markdown 渲染成「顶层块元素」节点数组（与 renderPreview 一致的块模型）。
    function aiMarkdownToNodes(md) {
      const newBlocks = markdownToBlocks(md).map(b => normalizeBlock(b));
      const wrap = document.createElement('div');
      wrap.innerHTML = newBlocks.map(blockToElementHtml).join('') || '<p><br></p>';
      return Array.from(wrap.childNodes);
    }

    function setAiBusy(on) {
      aiBusy = on;
      aiAssistBtn.classList.toggle('busy', on);
      aiAssistBtn.disabled = on || !(previewHasSelection() || previewHasCaret());
      [aiRewriteGo, aiRewriteCancel, aiSupplementGo, aiSupplementCancel].forEach(b => { if (b) b.disabled = on; });
      aiAssistMenu.querySelectorAll('.rt-ai-item').forEach(b => { b.disabled = on; });
      [aiCompareAccept, aiCompareDiscard].forEach(b => { if (b) b.disabled = on; });
    }

    // ── 流式读取：fetch → resp.body.getReader() → 按 \n 拆 NDJSON 解析事件 ──
    // onEvent(evt) 处理每个事件；返回最终 done 事件（含 text）或抛错。
    async function streamAiAssist(payload, onEvent) {
      const res = await fetch('/api/ai-assist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.body) {
        // 退化：无流式 body，整体读 JSON（容错）。
        const data = await res.json().catch(() => null);
        if (data) onEvent(data.success ? { phase: 'done', success: true, text: data.text } : { phase: 'error', error: data.error });
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 1);
          if (!line) continue;
          let evt = null;
          try { evt = JSON.parse(line); } catch (e) { continue; }
          if (evt) onEvent(evt);
        }
      }
      const tail = buf.trim();
      if (tail) { try { onEvent(JSON.parse(tail)); } catch (e) {} }
    }

    // ── 统一发起：扩/缩/改用高亮源，补充用光标前后文 ──
    async function runAiAssist(mode, requirement) {
      if (aiBusy) return;
      let captured = null;
      let withImages = false;
      const payload = { mode };
      // 政治脱敏：editor 是独立页，复用首页同一 localStorage 键，带进 AI帮写请求。
      payload.political_filter = localStorage.getItem('hotstream.politicalFilter') === '1';

      if (mode === 'supplement') {
        const ctx = captureCaretContext();
        if (!ctx) { showToast('请先把光标放在文档中要补充的位置'); closeAiMenu(); return; }
        captured = ctx;
        payload.requirement = requirement || '';
        payload.before_text = ctx.beforeText;
        payload.after_text = ctx.afterText;
      } else {
        // 优先用持久高亮作为作用对象；没有则从当前选区铺一次。
        if (!aiHighlight) {
          rememberSelection();
          const r = (savedSelection && !savedSelection.collapsed) ? savedSelection : null;
          if (r) applyAiHighlight(r.cloneRange());
        }
        captured = captureFromHighlight();
        if (!captured || !captured.markdown.trim()) {
          showToast('请先选中要处理的文案');
          closeAiMenu();
          return;
        }
        payload.text = captured.markdown;
        if (mode === 'rewrite') {
          payload.requirement = requirement || '';
          if (captured.images.length) { payload.images = captured.images; withImages = true; }
        }
      }

      setAiBusy(true);
      aiRewriteBox.hidden = true;
      aiSupplementBox.hidden = true;
      showAiProgress(withImages);

      let resultMd = '';
      let streamError = '';
      try {
        await streamAiAssist(payload, evt => {
          if (!evt || !evt.phase) return;
          if (evt.phase === 'error') { streamError = evt.error || 'AI 生成失败，请稍后再试'; return; }
          setAiPhase(evt.phase);
          if (evt.phase === 'done') resultMd = String(evt.text || '').trim();
        });
      } catch (err) {
        streamError = (err && err.message) ? err.message : '请稍后再试';
      }

      setAiBusy(false);
      if (streamError) { hideAiProgress(); showToast('AI 生成失败：' + streamError); return; }
      if (!resultMd) { hideAiProgress(); showToast('AI 没有返回内容'); return; }

      // 不再自动套用：弹出「原 vs AI」对比预览，接受后才执行替换/插入。
      openAiCompare(mode, requirement, resultMd, captured);
    }

    // ── 补充模式：取光标前后文（当前块及相邻块文本，各截断到 ~1200 字） ──
    const SUPPLEMENT_CTX_LIMIT = 1200;
    function captureCaretContext() {
      restoreSelection();
      const sel = window.getSelection();
      let range = (sel && sel.rangeCount) ? sel.getRangeAt(0) : (savedSelection || null);
      if (!range || !range.collapsed || !previewDoc.contains(range.startContainer)) return null;
      // 定位光标所在的顶层块。
      let blockEl = range.startContainer;
      if (blockEl.nodeType === 3) blockEl = blockEl.parentNode;
      while (blockEl && blockEl.parentNode !== previewDoc && blockEl !== previewDoc) blockEl = blockEl.parentNode;
      if (!blockEl || blockEl === previewDoc) {
        // 光标直接落在 previewDoc 上：取首个块兜底。
        blockEl = previewDoc.firstElementChild;
      }
      // 块内：以光标为界切出块内前/后文。
      const inBlockBefore = document.createRange();
      inBlockBefore.selectNodeContents(blockEl || previewDoc);
      try { inBlockBefore.setEnd(range.startContainer, range.startOffset); } catch (e) {}
      const inBlockAfter = document.createRange();
      inBlockAfter.selectNodeContents(blockEl || previewDoc);
      try { inBlockAfter.setStart(range.startContainer, range.startOffset); } catch (e) {}
      const textOf = el => (el && el.textContent ? el.textContent.replace(/\s+/g, ' ').trim() : '');
      // 相邻块文本（各取一块，丰富上下文）。
      const prevBlock = blockEl ? blockEl.previousElementSibling : null;
      const nextBlock = blockEl ? blockEl.nextElementSibling : null;
      let beforeText = (textOf(prevBlock) + '\n' + (inBlockBefore.toString() || '')).trim();
      let afterText = ((inBlockAfter.toString() || '') + '\n' + textOf(nextBlock)).trim();
      if (beforeText.length > SUPPLEMENT_CTX_LIMIT) beforeText = beforeText.slice(-SUPPLEMENT_CTX_LIMIT);
      if (afterText.length > SUPPLEMENT_CTX_LIMIT) afterText = afterText.slice(0, SUPPLEMENT_CTX_LIMIT);
      return { caretRange: range.cloneRange(), blockEl, beforeText, afterText, supplement: true };
    }

    // ── 对比预览浮层 ─────────────────────────────────────────────────────────
    function openAiCompare(mode, requirement, resultMd, captured) {
      aiCompareState = { mode, requirement, resultMd, captured };
      const isSupp = mode === 'supplement';
      aiCompareBadge.textContent = isSupp ? 'AI 补充' : (mode === 'expand' ? 'AI 扩写' : (mode === 'condense' ? 'AI 缩写' : 'AI 改写'));
      // 左/上：原内容。补充态显示「光标处上下文」，其它态显示选区文字+图片原样渲染。
      aiCompareOrig.innerHTML = '';
      if (isSupp) {
        aiCompareOrigHead.innerHTML = '<span class="tag"></span>光标处（上下文）';
        const wrap = document.createElement('div');
        wrap.className = 'ai-compare-render';
        wrap.innerHTML = (captured.beforeText ? escapeHtml(captured.beforeText).replace(/\n/g, '<br>') : '<em style="color:var(--muted)">（前文为空）</em>')
          + '<div style="margin:8px 0;color:var(--primary);font-weight:700">↧ 在此处插入 ↧</div>'
          + (captured.afterText ? escapeHtml(captured.afterText).replace(/\n/g, '<br>') : '<em style="color:var(--muted)">（后文为空）</em>');
        aiCompareOrig.appendChild(wrap);
      } else {
        aiCompareOrigHead.innerHTML = '<span class="tag"></span>原内容';
        // 选区文字（高亮 span 原样内容）+ 图片 figure 原样渲染。
        const holder = document.createElement('div');
        (aiHighlight && aiHighlight.spans || []).forEach(span => {
          const p = document.createElement('span');
          p.innerHTML = span.innerHTML;
          holder.appendChild(p);
        });
        if (captured.preservedFigures && captured.preservedFigures.length) {
          holder.innerHTML += captured.preservedFigures.join('');
        }
        aiCompareOrig.innerHTML = holder.innerHTML || '<em style="color:var(--muted)">（无文字内容）</em>';
      }
      // 右/下：AI 结果渲染（补充态额外标注「将插入的内容」）。
      aiCompareResultHead.innerHTML = '<span class="tag"></span>' + (isSupp ? 'AI 结果（将插入此内容）' : 'AI 结果');
      const resultNodes = aiMarkdownToNodes(resultMd);
      aiCompareResult.innerHTML = '';
      resultNodes.forEach(n => aiCompareResult.appendChild(n.cloneNode(true)));
      if (!isSupp && captured.preservedFigures && captured.preservedFigures.length) {
        const note = document.createElement('div');
        note.style.cssText = 'margin-top:8px;font-size:12px;color:var(--muted)';
        note.textContent = '原选区中的图片将被保留并接在文字之后。';
        aiCompareResult.appendChild(note);
      }
      aiCompareHint.textContent = isSupp
        ? '接受后去掉「待确认」标记成为正文；放弃则移除该段。'
        : '接受后才会替换所选文字（图片保留）；放弃则保持原样。';
      // 补充模式：在光标处放入「高亮模拟插入」块（虚线框 + 特殊底色 + 待确认角标）。
      if (isSupp) buildSupplementPreviewEl(resultMd, captured);
      aiCompare.hidden = false;
      aiCompare.classList.add('show');
      setTimeout(() => aiCompareAccept.focus(), 0);
    }

    // 在光标所在块之后插入一个 .ai-supplement-preview 容器作为「模拟插入」预览。
    // 接受 → 去掉容器、内容留在原位；放弃 → 整块移除。
    function buildSupplementPreviewEl(resultMd, captured) {
      removeSupplementPreviewEl();
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      const box = document.createElement('div');
      box.className = 'ai-supplement-preview';
      box.setAttribute('contenteditable', 'false');
      box.setAttribute('data-ai-supplement-preview', '1');
      aiMarkdownToNodes(resultMd).forEach(n => box.appendChild(n));
      const blockEl = captured.blockEl;
      aiSuppressHighlightClear = true;
      if (blockEl && blockEl.parentNode === previewDoc) blockEl.after(box);
      else previewDoc.appendChild(box);
      aiSuppressHighlightClear = false;
      aiSupplementPreviewEl = box;
      box.scrollIntoView({ block: 'nearest' });
    }

    function removeSupplementPreviewEl() {
      if (aiSupplementPreviewEl && aiSupplementPreviewEl.parentNode) {
        aiSuppressHighlightClear = true;
        aiSupplementPreviewEl.parentNode.removeChild(aiSupplementPreviewEl);
        aiSuppressHighlightClear = false;
      }
      aiSupplementPreviewEl = null;
    }

    function closeAiCompare() {
      aiCompare.classList.remove('show');
      aiCompare.hidden = true;
      aiCompareState = null;
      hideAiProgress();
    }

    // 接受预览：执行替换（扩/缩/改）或插入（补充）。
    function acceptAiCompare() {
      if (!aiCompareState) { closeAiCompare(); return; }
      const { mode, resultMd, captured } = aiCompareState;
      try {
        if (mode === 'supplement') applySupplement(resultMd, captured);
        else applyRewriteReplacement(mode, resultMd, captured);
      } catch (err) {
        showToast('套用失败：' + (err && err.message ? err.message : '请重试'));
      } finally {
        clearAiHighlight();
        closeAiCompare();
        closeAiMenu();
        aiRewriteReq.value = '';
        aiSupplementReq.value = '';
        refreshAiAvailability();
      }
    }

    // 放弃预览：不改动文档；补充态移除模拟插入块；保留高亮直到用户重新选择。
    function discardAiCompare() {
      removeSupplementPreviewEl();
      closeAiCompare();
      showToast('已放弃本次 AI 结果');
    }

    // 扩/缩/改：用 AI markdown 替换高亮文字，保留高亮内的图片 figure。
    function applyRewriteReplacement(mode, resultMd, captured) {
      if (!captured || !captured.firstNode || !captured.lastNode) throw new Error('找不到要替换的内容');
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      aiSuppressHighlightClear = true;
      // 构造覆盖整个高亮范围的 range（首节点前 → 尾节点后）。
      const range = document.createRange();
      range.setStartBefore(captured.firstNode);
      range.setEndAfter(captured.lastNode);
      // 保留的图片 figure（克隆 outerHTML，删除前已记在 captured.preservedFigures）。
      const preserved = captured.preservedFigures || [];
      range.deleteContents();
      const nodes = aiMarkdownToNodes(resultMd);
      if (preserved.length) {
        const figWrap = document.createElement('div');
        figWrap.innerHTML = preserved.join('');
        Array.from(figWrap.querySelectorAll('figure')).forEach(f => {
          f.classList.remove('ai-sel'); // 去掉高亮描边
          f.dataset.blockId = makeId('image'); // 重新生成 id 防冲突
          nodes.push(f);
        });
      }
      const insertFrag = document.createDocumentFragment();
      nodes.forEach(n => insertFrag.appendChild(n));
      const lastNode = insertFrag.lastChild;
      range.insertNode(insertFrag);
      // 光标落到插入内容之后。
      const sel = window.getSelection();
      if (lastNode) {
        const after = document.createRange();
        after.setStartAfter(lastNode);
        after.collapse(true);
        sel.removeAllRanges();
        sel.addRange(after);
        savedSelection = after.cloneRange();
      }
      aiSuppressHighlightClear = false;
      wireFigureTools();
      syncBlocksFromDom();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
      saveDraft({ silent: true });
      const label = mode === 'expand' ? '已扩写' : (mode === 'condense' ? '已缩写' : '已改写');
      showToast(label + '所选文案' + (preserved.length ? '（图片已保留）' : ''));
    }

    // 补充：把「模拟插入」块去掉虚线框/标记，内容原位成为正文（接受时）。
    function applySupplement(resultMd, captured) {
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      aiSuppressHighlightClear = true;
      let lastNode = null;
      if (aiSupplementPreviewEl && aiSupplementPreviewEl.parentNode) {
        // 把容器内的块节点搬出到容器位置，再移除空容器（去标记成正文）。
        const box = aiSupplementPreviewEl;
        const parent = box.parentNode;
        while (box.firstChild) { lastNode = box.firstChild; parent.insertBefore(box.firstChild, box); }
        parent.removeChild(box);
        aiSupplementPreviewEl = null;
      } else {
        // 兜底：预览块不在了，直接在光标块后插入。
        const nodes = aiMarkdownToNodes(resultMd);
        const frag = document.createDocumentFragment();
        nodes.forEach(n => { frag.appendChild(n); });
        lastNode = frag.lastChild;
        const blockEl = captured.blockEl;
        if (blockEl && blockEl.parentNode === previewDoc) blockEl.after(frag);
        else previewDoc.appendChild(frag);
      }
      aiSuppressHighlightClear = false;
      const sel = window.getSelection();
      if (lastNode) {
        const after = document.createRange();
        after.setStartAfter(lastNode);
        after.collapse(true);
        sel.removeAllRanges();
        sel.addRange(after);
        savedSelection = after.cloneRange();
      }
      wireFigureTools();
      syncBlocksFromDom();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
      saveDraft({ silent: true });
      showToast('已在光标处补充内容');
    }

    // 入口按钮：mousedown 时记忆当前选区（避免点击工具栏丢失），click 开关菜单
    aiAssistBtn.addEventListener('mousedown', e => { e.preventDefault(); rememberSelection(); });
    aiAssistBtn.addEventListener('click', () => {
      if (aiAssistMenu.hidden) openAiMenu(); else closeAiMenu();
    });
    // 菜单内按钮也要在 mousedown 时保住选区
    aiAssistMenu.addEventListener('mousedown', e => {
      // textarea 需要正常获取焦点编辑；其余按钮阻止默认以保留 previewDoc 选区/高亮
      if (e.target !== aiRewriteReq && e.target !== aiSupplementReq) { e.preventDefault(); rememberSelection(); }
    });
    aiAssistMenu.querySelectorAll('.rt-ai-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.disabled) return;
        const mode = item.dataset.aiMode;
        if (mode === 'rewrite') {
          aiRewriteBox.hidden = false;
          aiSupplementBox.hidden = true;
          setTimeout(() => aiRewriteReq.focus(), 0);
          return;
        }
        if (mode === 'supplement') {
          aiSupplementBox.hidden = false;
          aiRewriteBox.hidden = true;
          setTimeout(() => aiSupplementReq.focus(), 0);
          return;
        }
        runAiAssist(mode, '');
      });
    });
    aiRewriteGo.addEventListener('click', () => {
      const req = aiRewriteReq.value.trim();
      if (!req) { showToast('请填写改写要求'); aiRewriteReq.focus(); return; }
      runAiAssist('rewrite', req);
    });
    aiRewriteCancel.addEventListener('click', () => { aiRewriteBox.hidden = true; aiRewriteReq.value = ''; });
    aiSupplementGo.addEventListener('click', () => {
      const req = aiSupplementReq.value.trim();
      if (!req) { showToast('请填写补充要求'); aiSupplementReq.focus(); return; }
      runAiAssist('supplement', req);
    });
    aiSupplementCancel.addEventListener('click', () => { aiSupplementBox.hidden = true; aiSupplementReq.value = ''; });
    // 对比浮层按钮
    aiCompareAccept.addEventListener('click', acceptAiCompare);
    aiCompareDiscard.addEventListener('click', discardAiCompare);
    aiCompareBackdrop.addEventListener('click', discardAiCompare);
    // 点击菜单外区域关闭
    document.addEventListener('mousedown', e => {
      if (!aiAssistMenu.hidden && !aiAssistMenu.contains(e.target) && e.target !== aiAssistBtn && !aiAssistBtn.contains(e.target)) {
        closeAiMenu();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (aiCompare.classList.contains('show')) { discardAiCompare(); return; }
      if (!aiAssistMenu.hidden) closeAiMenu();
    });
    // 选区变化时刷新可用性与菜单模式；用户在 previewDoc 内重新选择时清除旧高亮。
    function onPreviewSelectionMaybeClearHighlight() {
      if (aiSuppressHighlightClear || aiBusy) return;
      if (aiCompare.classList.contains('show')) return; // 预览期间保持高亮
      if (aiIgnoreSelChange > 0) { aiIgnoreSelChange--; return; } // 吞掉铺设高亮引发的 selectionchange
      if (!aiHighlight) return;
      // 若当前选区/光标仍完全落在高亮 span 内（我们改 DOM 的余波），不清除。
      const sel = window.getSelection();
      if (sel && sel.rangeCount) {
        let node = sel.anchorNode;
        while (node && node !== previewDoc) {
          if (node.nodeType === 1 && node.classList && node.classList.contains('ai-sel')) return;
          node = node.parentNode;
        }
      }
      // 用户做出了新的选择/移动光标到高亮之外 → 视为重新选择，清除旧的持久高亮。
      clearAiHighlight();
    }
    previewDoc.addEventListener('keyup', () => { refreshAiAvailability(); });
    previewDoc.addEventListener('mouseup', () => { refreshAiAvailability(); });
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === previewDoc) {
        onPreviewSelectionMaybeClearHighlight();
        refreshAiAvailability();
        if (!aiAssistMenu.hidden) syncAiMenuModes();
      }
    });

    const fontNameSelect = document.getElementById('fontName');
    fontNameSelect.addEventListener('mousedown', rememberSelection);
    fontNameSelect.addEventListener('change', () => {
      if (fontNameSelect.value) execInline('fontName', fontNameSelect.value);
    });

    titleInput.addEventListener('input', () => updateDerived());
    document.getElementById('platformPreset').addEventListener('change', () => {});
    document.getElementById('assetUpload').addEventListener('change', (event) => addFiles(event.target.files));
    document.getElementById('loadDraftBtn').addEventListener('click', () => { window.location.href = '/drafts'; });
    document.getElementById('saveDraftBtn').addEventListener('click', () => saveDraftToServer());
    document.getElementById('exportImageBtn').addEventListener('click', exportLongImage);
    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = '/app'; });

    // ── 撤销 / 恢复 历史栈 ─────────────────────────────────────────────────
    const HISTORY_MAX = 30;
    /** @type {string[]} */
    const historyStack = [];
    let historyIdx = -1;   // 指向当前快照
    let _historyDebounce = null;

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');

    function updateUndoRedoBtns() {
      undoBtn.disabled = historyIdx <= 0;
      redoBtn.disabled = historyIdx >= historyStack.length - 1;
    }

    /** 推一次快照（当前 previewDoc.innerHTML） */
    function pushHistory() {
      const snap = previewDoc.innerHTML;
      // 与当前位置快照相同则不推
      if (historyStack[historyIdx] === snap) return;
      // 截断 redo 分支
      historyStack.splice(historyIdx + 1);
      historyStack.push(snap);
      // 超出上限时丢最早的
      if (historyStack.length > HISTORY_MAX) {
        historyStack.shift();
      }
      historyIdx = historyStack.length - 1;
      updateUndoRedoBtns();
    }

    /** debounced 版本，供 input 事件使用 */
    function pushHistoryDebounced() {
      clearTimeout(_historyDebounce);
      _historyDebounce = setTimeout(pushHistory, 300);
    }

    /** 立即推快照（结构性操作后调用） */
    function pushHistoryNow() {
      clearTimeout(_historyDebounce);
      pushHistory();
    }

    function applySnapshot(snap) {
      previewDoc.innerHTML = snap;
      // innerHTML 替换会丢掉图片块的删除/替换/拖动监听，需重新绑定。
      wireFigureTools();
      // 空文档时维持 placeholder（与 renderPreview 一致）。
      if (!previewDoc.textContent.trim() && !previewDoc.querySelector('figure,img,hr.pagebreak')) {
        previewDoc.setAttribute('data-empty', '1');
      } else {
        previewDoc.removeAttribute('data-empty');
      }
      syncBlocksFromDom();
      saveDraft({ silent: true });
      updateUndoRedoBtns();
    }

    function doUndo() {
      if (historyIdx <= 0) return;
      historyIdx--;
      applySnapshot(historyStack[historyIdx]);
    }

    function doRedo() {
      if (historyIdx >= historyStack.length - 1) return;
      historyIdx++;
      applySnapshot(historyStack[historyIdx]);
    }

    undoBtn.addEventListener('click', doUndo);
    redoBtn.addEventListener('click', doRedo);

    // Ctrl+Z / Ctrl+Y 拦截（仅在 previewDoc 有焦点时）
    previewDoc.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        doUndo();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
        e.preventDefault();
        doRedo();
      }
    });

    // 监听 previewDoc input（debounce 推快照）
    previewDoc.addEventListener('input', pushHistoryDebounced);

    loadInitialDraft();
    // 初始快照（内容载入后立即推，保证第一次撤销能回到初始状态）
    setTimeout(() => pushHistoryNow(), 0);

    // ── Current-user bar (injected by the Next.js auth layer) ──
    (async function userBar() {
      try {
        const r = await fetch('/api/auth/me', { cache: 'no-store' });
        const d = await r.json();
        if (!d || !d.success) return;
        const name = d.user.displayName || d.user.username;
        const userSvg = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        const usersSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
        const outSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>';
        const draftSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>';
        const bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;top:12px;right:16px;z-index:9999;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text-2);background:var(--surface);backdrop-filter:blur(6px);padding:6px 12px;border:1px solid var(--border-strong);border-radius:999px;box-shadow:var(--shadow-menu);';
        const who = document.createElement('span');
        who.style.cssText = 'display:inline-flex;align-items:center;gap:6px;';
        who.innerHTML = userSvg + ' ' + escapeHtml(name);
        bar.appendChild(who);
        if (d.user.role === 'admin') {
          const a = document.createElement('a');
          a.href = '/admin/users';
          a.innerHTML = usersSvg + ' 用户管理';
          a.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--primary);text-decoration:none;';
          bar.appendChild(a);
        }
        const drafts = document.createElement('a');
        drafts.href = '/drafts';
        drafts.innerHTML = draftSvg + ' 草稿';
        drafts.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(drafts);
        const bookSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
        const knowledge = document.createElement('a');
        knowledge.href = '/knowledge';
        knowledge.innerHTML = bookSvg + ' 知识库';
        knowledge.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(knowledge);
        const presetSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>';
        const presetsLink = document.createElement('a');
        presetsLink.href = '/presets';
        presetsLink.innerHTML = presetSvg + ' 预设';
        presetsLink.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(presetsLink);
        const gearSvg = '<svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>';
        const profile = document.createElement('a');
        profile.href = '/profile';
        profile.innerHTML = gearSvg + ' 设置';
        profile.style.cssText = 'display:inline-flex;align-items:center;gap:5px;color:var(--accent-warm);text-decoration:none;';
        bar.appendChild(profile);
        const out = document.createElement('button');
        out.innerHTML = outSvg + ' 登出';
        out.style.cssText = 'display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;';
        out.onclick = async () => { try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {} location.href = '/login'; };
        bar.appendChild(out);
        const sunSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
        const moonSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>';
        const themeBtn = document.createElement('button');
        themeBtn.title = '切换日间/夜间模式';
        themeBtn.setAttribute('aria-label', '切换日间/夜间模式');
        themeBtn.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--accent-warm);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;';
        function updateThemeIcon() {
          themeBtn.innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? moonSvg : sunSvg;
        }
        updateThemeIcon();
        themeBtn.onclick = function() {
          var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('hotstream.theme', next); } catch(e) {}
          document.documentElement.classList.add('theme-anim');
          setTimeout(function() { document.documentElement.classList.remove('theme-anim'); }, 350);
          updateThemeIcon();
        };
        bar.appendChild(themeBtn);
        document.body.appendChild(bar);
      } catch (e) { /* ignore */ }
    })();
  </script>
</body>
</html>

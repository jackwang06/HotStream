<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HotStream 文案编辑器</title>
  <script>(function(){try{var t=localStorage.getItem('hotstream.theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <style>
    :root {
      --bg: #0e120f;
      --surface: #161b17;
      --surface-2: #1d231f;
      --surface-3: #252d27;
      --border: #2b332d;
      --border-strong: #3a443c;
      --card: #161b17;
      --line: #2b332d;
      --text: #eef2ee;
      --text-2: #c2cbc4;
      --muted: #8b988f;
      --primary: #2fb389;
      --primary-hover: #38c79a;
      --primary-active: #259a75;
      --primary-soft: rgba(47, 179, 137, .14);
      --primary-ring: rgba(47, 179, 137, .45);
      --accent: #2fb389;
      --accent-soft: rgba(47, 179, 137, .14);
      --accent-warm: #d9a23b;
      --accent-warm-soft: rgba(217, 162, 59, .16);
      --on-accent: #07140e;
      --ok: #3ec98a;
      --danger: #e76273;
      --danger-soft: rgba(231, 98, 115, .16);
      --radius: 12px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --radius-full: 999px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-menu: 0 4px 16px rgba(0, 0, 0, .45);
      --t-fast: 120ms ease-out;
      --t-base: 170ms ease-out;
      --t-slow: 200ms ease-in-out;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", "Source Han Sans SC", "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Code", "Sarasa Mono SC", monospace;
      --editor-work-area-height: calc(100vh - 312px);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 80% -10%, var(--primary-soft), transparent 60%),
        radial-gradient(900px 460px at 0% 110%, var(--accent-warm-soft), transparent 55%),
        var(--bg);
    }

    button, textarea, input, select { font: inherit; }
    button { cursor: pointer; }

    .icon { display: inline-block; vertical-align: -0.125em; flex: none; }

    .page {
      width: min(1560px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand .logo .icon { width: 22px; height: 22px; }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      color: var(--on-accent);
      background: var(--primary);
    }

    .toolbar {
      /* Drop the toolbar onto its own row below the brand so it never sits under
         the fixed top-right user bar (设置/草稿/登出). */
      flex: 1 1 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      color: var(--text);
      background: var(--surface-2);
      font-weight: 600;
      transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast);
    }
    .btn .icon { width: 16px; height: 16px; }

    .btn:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .btn:active { transform: scale(.98); }
    .btn.primary { border-color: var(--primary); color: var(--on-accent); background: var(--primary); }
    .btn.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); }
    .btn.accent { border-color: transparent; color: var(--on-accent); background: linear-gradient(135deg, var(--primary-active), var(--primary)); }
    .btn.accent:hover { filter: brightness(1.06); background: linear-gradient(135deg, var(--primary-active), var(--primary)); }
    .btn.danger { color: var(--danger); background: transparent; border-color: var(--danger-soft); }
    .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn.small { padding: 7px 9px; border-radius: var(--radius-md); font-size: 12px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(560px, 1fr) minmax(300px, .5fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      min-height: calc(100vh - 126px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; }
    .panel-title .icon { width: 18px; height: 18px; color: var(--primary); }
    .step {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      color: var(--on-accent);
      background: var(--primary);
      font-size: 13px;
      font-weight: 800;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px 18px 18px; }

    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .field label { color: var(--text-2); font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    input, select { padding: 12px 13px; }
    textarea {
      resize: vertical;
      padding: 13px;
      line-height: 1.76;
      font-size: 15px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .meta-line { color: var(--muted); font-size: 12px; line-height: 1.65; }

    /* ── WYSIWYG 富文本工具栏（作用于可编辑预览） ── */
    .rt-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .rt-group { display: inline-flex; align-items: center; gap: 4px; padding-right: 6px; border-right: 1px solid var(--border); }
    .rt-group:last-child { border-right: 0; padding-right: 0; }
    .rt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      background: var(--surface);
      font-weight: 700;
      font-size: 13px;
      transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast);
    }
    .rt-btn:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .rt-btn .icon { width: 16px; height: 16px; }
    .rt-btn[data-active="1"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .rt-btn.b-style { font-weight: 800; }
    .rt-btn.i-style { font-style: italic; font-family: serif; }
    .rt-btn.u-style { text-decoration: underline; }
    .rt-select {
      width: auto;
      min-width: 92px;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--radius-md);
      font-size: 13px;
      background: var(--surface);
    }
    /* ── 编辑面板内的标题 + 头部控件 ── */
    .editor-head { display: grid; gap: 10px; padding: 14px 14px 0; }
    .editor-head .editor-title-input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
    }
    .editor-head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .editor-head-actions .spacer { flex: 1 1 auto; }
    .editor-head-actions .meta { color: var(--muted); font-size: 12px; }

    /* ── 颜色一键 + 最近预设 ── */
    .rt-color-wrap { display: inline-flex; align-items: center; gap: 4px; }
    .rt-color-main {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      background: var(--surface);
      font-weight: 700;
      font-size: 13px;
    }
    .rt-color-main:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .rt-color-main .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,.2);
      background: #e11d48;
      flex: none;
    }
    .rt-color-presets { display: inline-flex; align-items: center; gap: 3px; }
    .rt-color-preset {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      transition: transform var(--t-fast), border-color var(--t-fast);
    }
    .rt-color-preset:hover { transform: scale(1.12); border-color: var(--border-strong); }
    .rt-color-add {
      position: relative;
      width: 24px;
      height: 32px;
      overflow: hidden;
    }
    .rt-color-add input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      padding: 0;
      border: 0;
    }

    /* 格式刷激活态 */
    .rt-btn.painting[data-active="1"],
    .rt-btn#formatPainter[data-active="1"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .preview-doc.painting { cursor: crosshair; }

    /* ── AI 帮写：工具栏入口 + 下拉动作菜单 ── */
    .rt-ai-wrap { position: relative; display: inline-flex; }
    .rt-ai-btn { gap: 6px; }
    .rt-ai-btn .rt-ai-label { font-size: 13px; font-weight: 700; }
    .rt-ai-btn:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .rt-ai-btn:disabled { opacity: .55; cursor: not-allowed; }
    .rt-ai-btn[aria-expanded="true"] { background: var(--primary); color: var(--on-accent); border-color: var(--primary); }
    .rt-ai-btn.busy { pointer-events: none; opacity: .75; }
    .rt-ai-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 30;
      min-width: 230px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-menu);
    }
    .rt-ai-menu[hidden] { display: none; }
    .rt-ai-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text);
      background: transparent;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
    }
    .rt-ai-item:hover { border-color: var(--border); background: var(--surface-2); }
    .rt-ai-item .rt-ai-sub { color: var(--muted); font-size: 11px; font-weight: 500; }
    .rt-ai-rewrite { display: grid; gap: 8px; margin-top: 4px; padding: 8px; border-top: 1px solid var(--border); }
    .rt-ai-rewrite[hidden] { display: none; }
    .rt-ai-req { min-height: 52px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
    .rt-ai-rewrite-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .rt-ai-go, .rt-ai-cancel {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
    }
    .rt-ai-go { color: var(--on-accent); background: var(--primary); border-color: var(--primary); }
    .rt-ai-go:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .rt-ai-cancel { color: var(--text); background: var(--surface-2); }
    .rt-ai-cancel:hover { background: var(--surface-3); }

    /* ── AI 帮写：持久选中高亮（即使浏览器原生选区消失也保持） ── */
    /* 文字：用 .ai-sel 包裹的内联片段加柔和底色；图片 figure 加明显描边+角标 */
    .preview-doc .ai-sel { background: var(--primary-soft); border-radius: 3px; box-shadow: 0 0 0 1px var(--primary) inset; }
    .preview-doc figure.ai-sel { position: relative; outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
    .preview-doc figure.ai-sel::after {
      content: "AI 作用对象";
      position: absolute; top: 4px; left: 4px; z-index: 4;
      padding: 2px 7px; font-size: 11px; font-weight: 700; line-height: 1.4;
      color: var(--on-accent); background: var(--primary);
      border-radius: 999px; box-shadow: var(--shadow-menu); pointer-events: none;
    }

    /* ── AI 帮写：进度指示（步骤条），出现在 AI 菜单与对比浮层里 ── */
    .ai-progress { display: grid; gap: 8px; padding: 10px; }
    .ai-progress[hidden] { display: none; }
    .ai-progress-bar { position: relative; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
    .ai-progress-fill { position: absolute; inset: 0 100% 0 0; background: var(--primary); border-radius: 999px; transition: right var(--t-base); }
    .ai-progress-steps { display: flex; gap: 6px; flex-wrap: wrap; }
    .ai-progress-step {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; font-size: 11px; font-weight: 700; line-height: 1.5;
      color: var(--muted); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 999px;
    }
    .ai-progress-step[data-state="active"] { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
    .ai-progress-step[data-state="done"] { color: var(--on-accent); border-color: var(--primary); background: var(--primary); }
    .ai-progress-step[data-state="failed"] { color: var(--accent-warm); border-color: var(--accent-warm); }
    .ai-progress-step[hidden] { display: none; }
    .ai-progress-step .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ── AI 帮写：「原 vs AI」对比预览浮层 ── */
    .ai-compare { position: fixed; inset: 0; z-index: 9998; display: none; }
    .ai-compare.show { display: block; }
    .ai-compare-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .42); backdrop-filter: blur(2px); }
    .ai-compare-dialog {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-menu); overflow: hidden;
    }
    .ai-compare-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .ai-compare-title { font-size: 15px; font-weight: 800; color: var(--text); display: inline-flex; align-items: center; gap: 8px; }
    .ai-compare-badge { padding: 2px 9px; font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 999px; }
    .ai-compare-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: auto; }
    .ai-compare-col { padding: 14px 18px; min-width: 0; }
    .ai-compare-col + .ai-compare-col { border-left: 1px solid var(--border); }
    .ai-compare-col-head { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: none; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px; }
    .ai-compare-col-head .tag { width: 8px; height: 8px; border-radius: 50%; }
    .ai-compare-col.orig .tag { background: var(--muted); }
    .ai-compare-col.result .tag { background: var(--primary); }
    .ai-compare-render { font-size: 14px; line-height: 1.7; color: var(--text); word-break: break-word; }
    .ai-compare-render :where(h1, h2, h3) { margin: .4em 0 .3em; line-height: 1.35; }
    .ai-compare-render p { margin: .5em 0; }
    .ai-compare-render img { max-width: 100%; border-radius: 6px; display: block; margin: 8px 0; }
    .ai-compare-render figure { margin: 8px 0; }
    .ai-compare-render figure .fig-tools { display: none; }
    .ai-compare-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); }
    .ai-compare-hint { margin-right: auto; font-size: 12px; color: var(--muted); }
    .ai-compare-btn { padding: 9px 18px; font-size: 14px; font-weight: 700; border: 1px solid var(--border); border-radius: var(--radius-md); }
    .ai-compare-accept { color: var(--on-accent); background: var(--primary); border-color: var(--primary); }
    .ai-compare-accept:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .ai-compare-discard { color: var(--text); background: var(--surface-2); }
    .ai-compare-discard:hover { background: var(--surface-3); }
    @media (max-width: 720px) {
      .ai-compare-body { grid-template-columns: 1fr; }
      .ai-compare-col + .ai-compare-col { border-left: none; border-top: 1px solid var(--border); }
    }

    /* ── AI 帮写：补充模式「模拟插入」标记（虚线框 + 特殊底色 + 待确认角标） ── */
    .preview-doc .ai-supplement-preview {
      position: relative;
      border: 1px dashed var(--primary);
      border-radius: 8px;
      background: var(--primary-soft);
      padding: 12px 12px 12px;
      margin: 8px 0;
    }
    .preview-doc .ai-supplement-preview::before {
      content: "AI 补充 · 待确认";
      position: absolute; top: -10px; left: 12px;
      padding: 1px 9px; font-size: 11px; font-weight: 700; line-height: 1.6;
      color: var(--on-accent); background: var(--primary);
      border-radius: 999px; box-shadow: var(--shadow-menu);
    }
    .preview-doc .ai-supplement-preview > :first-child { margin-top: 0; }
    .preview-doc .ai-supplement-preview > :last-child { margin-bottom: 0; }

    .image-block-body { padding: 12px; }
    .image-block-body img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius-md);
      background: var(--surface-3);
    }
    .image-caption { margin-top: 8px; color: var(--muted); font-size: 12px; }

    /* 预览外框：深色（与编辑器一致）；内部成品文档刻意保持白底（所见即所得，对应导出长图） */
    .preview-wrap {
      min-height: var(--editor-work-area-height);
      overflow: auto;
      padding: 18px;
      background: var(--surface-2);
    }
    .preview-doc {
      width: min(100%, 580px);
      margin: 0 auto;
      padding: 34px 34px 42px;
      border-radius: var(--radius-xl);
      background: #ffffff;
      color: #1c1917;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
    }
    .preview-doc:focus { outline: none; }
    .preview-doc:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
    .preview-doc h1 { margin: 0 0 18px; line-height: 1.25; letter-spacing: 0; font-size: 30px; font-weight: 800; color: #1c1917; }
    .preview-doc h2 { margin: 26px 0 12px; line-height: 1.3; font-size: 23px; font-weight: 800; color: #1c1917; }
    .preview-doc h3 { margin: 22px 0 10px; line-height: 1.35; font-size: 19px; font-weight: 700; color: #292524; }
    .preview-doc .source { margin-bottom: 22px; color: #78716c; font-size: 13px; }
    .preview-doc p { margin: 0 0 15px; line-height: 1.86; font-size: 16px; color: #1c1917; }
    .preview-doc strong { font-weight: 800; }
    .preview-doc em { font-style: italic; }
    .preview-doc figure { margin: 18px 0; }
    .preview-doc figure img,
    .preview-doc > img { display: block; width: 100%; max-height: 540px; object-fit: contain; margin: 0; border-radius: var(--radius-lg); background: #f3f4f6; }
    .preview-empty { color: #78716c; text-align: center; padding: 60px 0; }

    /* 编辑态修饰：图片块的删除/替换按钮（导出时移除） */
    .preview-doc figure { position: relative; }
    .preview-doc figure[draggable="true"] { cursor: grab; }
    .preview-doc figure.dragging { opacity: .45; }
    .fig-tools {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--t-fast);
    }
    .preview-doc figure:hover .fig-tools { opacity: 1; }
    .fig-tools button {
      border: 1px solid rgba(0,0,0,.12);
      border-radius: var(--radius-md);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1c1917;
      background: rgba(255,255,255,.92);
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .fig-tools button.del { color: #c62f46; }

    /* ── 分页符块：导出长图时此处切成下一张图 ── */
    .preview-doc hr.pagebreak {
      position: relative;
      display: block;
      width: 100%;
      height: 0;
      margin: 26px 0;
      padding: 0;
      border: 0;
      border-top: 2px dashed #c9b48a;
      background: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .preview-doc hr.pagebreak::after {
      content: '✂ 分页符（导出分图）';
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -50%);
      padding: 2px 12px;
      border: 1px solid #e2d4b0;
      border-radius: 999px;
      background: #fbf6ea;
      color: #9a7b32;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: .02em;
    }
    /* 选中态：用顶层块原生选区高亮提示可删除 */
    .preview-doc hr.pagebreak.selected { border-top-color: #c62f46; }
    .preview-doc hr.pagebreak.selected::after { border-color: #c62f46; color: #c62f46; background: #fdeaec; }

    .preview-doc[data-empty="1"] > p:only-child:empty::before,

      align-items: center;
      justify-content: center;
      gap: 8px;

      border-radius: var(--radius-lg);
      padding: 14px;
      color: var(--primary);
      background: var(--primary-soft);
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: border-color var(--t-fast), background var(--t-fast);

    .upload-label .icon { width: 16px; height: 16px; }
    .upload-label input { display: none; }
    .material-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
    .material-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }
    .material-card[draggable="true"] { cursor: grab; }
    .material-card img { display: block; width: 100%; aspect-ratio: 1.25; object-fit: cover; background: var(--surface-3); }
    .material-info { padding: 8px; }
    .material-title { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    /* 仅当悬停在该卡片上时，右上角出现的「插入」按钮 */
    .material-insert {
      position: absolute;
      top: 8px;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: auto;
      padding: 5px 9px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-full);
      color: var(--on-accent);
      background: var(--primary);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      opacity: 0;
      transform: translateY(-2px);
      pointer-events: none;
      transition: opacity var(--t-fast), transform var(--t-fast), background var(--t-fast);
    }
    .material-insert .icon { width: 13px; height: 13px; }
    .material-insert:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .material-card:hover .material-insert { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .empty { padding: 22px; border: 1px dashed var(--border); border-radius: var(--radius-lg); color: var(--muted); text-align: center; background: var(--surface-2); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 18px;
      border-radius: var(--radius-full);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-menu);
      transition: opacity var(--t-base), transform var(--t-base);
      font-size: 14px;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {

    const turndownService = (typeof TurndownService !== 'undefined')
      ? new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', emDelimiter: '*', strongDelimiter: '**' })
      : null;
    if (turndownService) {
      // 保留颜色/字体/下划线等 Markdown 不原生支持的内联 HTML。
      turndownService.keep(['span', 'u', 'font']);
    }

    const presets = {
      xhs: { width: 1080 },
      wechat: { width: 900 },
      simple: { width: 800 }
    };

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1900);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }

    function makeId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function proxyImageUrl(url) {
      if (!url || url.startsWith('data:') || url.startsWith('/api/proxy-image')) return url;
      return `/api/proxy-image?url=${encodeURIComponent(url)}`;
    }

    // ── inline Markdown <-> inline HTML for a single text block ──
    function inlineMdToHtml(md) {
      const raw = String(md == null ? '' : md);
      if (!raw.trim()) return '';
      if (typeof marked !== 'undefined' && typeof marked.parseInline === 'function') {
        try { return marked.parseInline(raw); } catch (e) { /* fall through */ }
      }
      return escapeHtml(raw);
    }

    function inlineHtmlToMd(html) {
      const raw = String(html == null ? '' : html);
      if (turndownService) {
        try {
          // turndown 对块级标签会包成段落；我们传入的是内联片段，去掉首尾空白即可。
          return turndownService.turndown(raw).trim();
        } catch (e) { /* fall through */ }
      }
      // 退化：剥掉标签，保留文本。
      const tmp = document.createElement('div');
      tmp.innerHTML = raw;
      return (tmp.textContent || '').trim();
    }

    function normalizeImage(image, index = 0) {
      const raw = image?.originalUrl || image?.url || image?.thumbnail || image?.displayUrl || '';
      const title = image?.title || `素材 ${index + 1}`;
      return {
        id: image?.id || makeId(`asset-${index}`),
        title,
        originalUrl: raw,
        displayUrl: image?.displayUrl || proxyImageUrl(raw),
        source: image?.source || '生成图片'
      };
    }

    function ensureMaterialForImage(url, title = '正文图片') {
      const normalizedUrl = proxyImageUrl(url);
      let asset = materials.find(item => item.displayUrl === normalizedUrl || item.originalUrl === url);
      if (!asset) {
        asset = normalizeImage({ url, title, source: '正文图片' }, materials.length);
        materials.unshift(asset);
      }
      return asset;
    }

    // ── Block model: text {id,type:'text',level,md} | image {id,type:'image',url,title,assetId} ──
    const HEADING_LEVELS = new Set(['h1', 'h2', 'h3']);

    function normalizeBlock(block, index = 0) {
      if (block?.type === 'pagebreak') {
        return { id: block.id || makeId('pagebreak'), type: 'pagebreak' };
      }
      if (block?.type === 'image') {
        const url = block.url || block.displayUrl || block.originalUrl || '';
        const asset = block.assetId ? materials.find(item => item.id === block.assetId) : ensureMaterialForImage(url, block.title || block.alt || `图片 ${index + 1}`);
        return {
          id: block.id || makeId('image'),
          type: 'image',
          title: block.title || block.alt || asset?.title || `图片 ${index + 1}`,
          url: asset?.displayUrl || proxyImageUrl(url),
          assetId: asset?.id || null
        };
      }
      // text block — backward compatible with legacy {type:'text', text}
      let level = (block && block.level) || 'p';
      if (!HEADING_LEVELS.has(level) && level !== 'p') level = 'p';
      let md = block && block.md != null ? String(block.md) : null;
      if (md == null) md = block && block.text != null ? String(block.text) : '';
      return {
        id: block?.id || makeId('text'),
        type: 'text',
        level,
        md: md
      };
    }

    // ── markdownToBlocks(md) -> blocks (contract) ──
    function markdownToBlocks(md) {
      const text = String(md == null ? '' : md).replace(/\r\n/g, '\n');
      const out = [];
      // Split into paragraphs by blank lines, but keep heading lines as their own block.
      const lines = text.split('\n');
      let buffer = [];
      const flushParagraph = () => {
        const joined = buffer.join('\n').trim();
        buffer = [];
        if (!joined) return;
        // standalone image paragraph -> image block
        const img = joined.match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)$/);
        if (img) {
          const asset = ensureMaterialForImage(img[2], img[1] || `图片 ${out.length + 1}`);
          out.push({ id: makeId('image'), type: 'image', title: img[1] || asset.title, url: asset.displayUrl, assetId: asset.id });
          return;
        }
        out.push({ id: makeId('text'), type: 'text', level: 'p', md: joined });
      };
      for (const rawLine of lines) {
        const line = rawLine;
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          const level = ['h1', 'h2', 'h3'][heading[1].length - 1];
          out.push({ id: makeId('text'), type: 'text', level, md: heading[2].trim() });
          continue;
        }
        // 整行的 --- / *** / ___（thematic break）-> 分页符块。
        // 注：生成提示词已禁止用 --- 包裹正文，不会误判生成内容。
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
          flushParagraph();
          out.push({ id: makeId('pagebreak'), type: 'pagebreak' });
          continue;
        }
        if (line.trim() === '') {
          flushParagraph();
          continue;
        }
        buffer.push(line);
      }
      flushParagraph();
      return out;
    }

    // ── blocksToMarkdown(blocks) -> md (contract) ──
    function blocksToMarkdown(list) {
      return (list || [])
        .map(block => {
          if (block.type === 'pagebreak') {
            return '---';
          }
          if (block.type === 'image') {
            return `![${(block.title || '图片素材').replace(/[\[\]]/g, '')}](${block.url})`;
          }
          const md = String(block.md == null ? '' : block.md).trim();
          if (block.level === 'h1') return `# ${md}`;
          if (block.level === 'h2') return `## ${md}`;
          if (block.level === 'h3') return `### ${md}`;
          return md;
        })
        .filter(part => part && part.trim())
        .join('\n\n');
    }

    function applyDraft(draft, metaText, { autoSave = true } = {}) {
      const safeDraft = draft || { title: '', content: '', images: [], blocks: [], topic: null };
      titleInput.value = safeDraft.title || safeDraft.topic?.title || '';
      sourceTopic = safeDraft.topic || null;
      materials = (safeDraft.images || []).filter(Boolean).map(normalizeImage);
      const rawBlocks = Array.isArray(safeDraft.content_blocks) && safeDraft.content_blocks.length
        ? safeDraft.content_blocks
        : (Array.isArray(safeDraft.blocks) ? safeDraft.blocks : []);
      if (rawBlocks.length) {
        blocks = rawBlocks.map(normalizeBlock);
      } else if (safeDraft.content) {
        // content is Markdown text (DeepSeek output / legacy serialized) -> parse to blocks
        blocks = markdownToBlocks(safeDraft.content);
      } else {
        blocks = [];
      }
      draftMeta.textContent = metaText || '草稿会保存在本机浏览器 localStorage；下次从主页点“继续编辑草稿”或直接打开编辑页会自动载入。';
      renderAll({ autoSave });
    }

    function loadInitialDraft() {
      const imported = localStorage.getItem(IMPORT_KEY);
      const live = localStorage.getItem(LIVE_KEY);
      let draft = null;
      let meta = '';
      if (imported) {
        try { draft = JSON.parse(imported); } catch { draft = null; }
        localStorage.removeItem(IMPORT_KEY);
        currentDraftId = draft && draft.id ? draft.id : null;
        meta = draft?.updated_at ? `已导入刚生成的内容 · ${new Date(draft.updated_at).toLocaleString('zh-CN')}` : '已导入刚生成的内容。';
      }
      if (!draft && live) {
        try { draft = JSON.parse(live); } catch { draft = null; }
        meta = draft?.updated_at ? `已自动载入本地草稿 · ${new Date(draft.updated_at).toLocaleString('zh-CN')}` : '已自动载入本地草稿。';
      }
      applyDraft(draft, meta, { autoSave: Boolean(draft) });
    }

    function loadSavedDraft() {
      const live = localStorage.getItem(LIVE_KEY);
      if (!live) return showToast('暂无可载入的本地草稿');
      let draft = null;
      try { draft = JSON.parse(live); } catch { draft = null; }
      if (!draft) return showToast('本地草稿读取失败');
      applyDraft(draft, `已载入本地草稿 · ${new Date(draft.updated_at || Date.now()).toLocaleString('zh-CN')}`);
      showToast('已载入本地草稿');
    }

    function currentDraft() {
      return {
        title: titleInput.value.trim(),
        content: blocksToMarkdown(blocks),
        content_blocks: blocks,
        blocks,
        topic: sourceTopic,
        images: materials,
        updated_at: new Date().toISOString()
      };
    }

    function saveDraft({ silent = false } = {}) {
      localStorage.setItem(LIVE_KEY, JSON.stringify(currentDraft()));
      if (!silent) showToast('草稿已保存；下次从主页点“继续编辑草稿”可载入');
    }

    async function saveDraftToServer() {
      const name = window.prompt('给这份草稿起个名字', titleInput.value.trim() || '未命名草稿');
      if (name === null) return;
      const title = name.trim() || '未命名草稿';
      const url = currentDraftId ? `/api/drafts/${currentDraftId}` : '/api/drafts';
      const method = currentDraftId ? 'PUT' : 'POST';
      try {
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content_blocks: blocks, images: materials })
        });
        const data = await res.json();
        if (!res.ok || !data || !data.success) throw new Error((data && data.error) || '保存失败');
        if (data.draft && data.draft.id) currentDraftId = data.draft.id;
        titleInput.value = title;
        updateDerived();
        showToast('草稿已保存到「草稿管理」');
      } catch (err) {
        showToast('保存失败：' + (err && err.message ? err.message : '请稍后再试'));
      }
    }

    // ── Render blocks INTO the contenteditable preview (preview === editor) ──
    function imageFigureHtml(block) {
      const safeUrl = escapeHtml(block.url);
      const safeTitle = escapeHtml(block.title || '图片素材');
      return `<figure contenteditable="false" draggable="true" data-block-id="${escapeHtml(block.id)}"${block.assetId ? ` data-asset-id="${escapeHtml(block.assetId)}"` : ''}>` +
        `<img src="${safeUrl}" alt="${safeTitle}" draggable="false" referrerpolicy="no-referrer" crossorigin="anonymous" />` +
        `<div class="fig-tools"><button type="button" class="rep" data-fig-action="replace" title="替换图片">替换</button>` +
        `<button type="button" class="del" data-fig-action="delete" title="删除图片">删除</button></div>` +
        `</figure>`;
    }

    function pageBreakHtml(block) {
      return `<hr class="pagebreak" data-pagebreak="1" data-block-id="${escapeHtml(block.id)}" contenteditable="false">`;
    }

    function blockToElementHtml(block) {
      if (block.type === 'pagebreak') return pageBreakHtml(block);
      if (block.type === 'image') return imageFigureHtml(block);
      const tag = HEADING_LEVELS.has(block.level) ? block.level : 'p';
      const inner = inlineMdToHtml(block.md) || '<br>';
      return `<${tag} data-block-id="${escapeHtml(block.id)}">${inner}</${tag}>`;
    }

    function renderPreview() {
      if (!blocks.length) {
        previewDoc.setAttribute('data-empty', '1');
        previewDoc.innerHTML = '<p data-block-id="' + escapeHtml(makeId('text')) + '"><br></p>';
        return;
      }
      previewDoc.removeAttribute('data-empty');
      previewDoc.innerHTML = blocks.map(blockToElementHtml).join('');
      wireFigureTools();
    }

    function wireFigureTools() {
      previewDoc.querySelectorAll('figure[data-block-id]').forEach(fig => {
        fig.querySelectorAll('[data-fig-action]').forEach(btn => {
          btn.addEventListener('mousedown', e => e.preventDefault());
          btn.addEventListener('click', () => {
            const id = fig.dataset.blockId;
            if (btn.dataset.figAction === 'delete') {
              fig.remove();
              syncBlocksFromDom();
              showToast('已删除图片');
            } else if (btn.dataset.figAction === 'replace') {
              replaceImageBlock(id);
            }
          });
        });
        // 正文内图片的拖动 = 移动（不复制）。idempotent: wireFigureTools 可能多次调用。
        if (!fig.dataset.moveWired) {
          fig.dataset.moveWired = '1';
          fig.addEventListener('dragstart', event => {
            draggedFigure = fig;
            try {
              event.dataTransfer.setData(MOVE_MIME, fig.dataset.blockId || '');
              event.dataTransfer.effectAllowed = 'move';
            } catch (e) {}
            fig.classList.add('dragging');
          });
          fig.addEventListener('dragend', () => {
            fig.classList.remove('dragging');
            draggedFigure = null;
          });
        }
      });
    }

    function replaceImageBlock(blockId) {
      if (!materials.length) return showToast('素材区暂无图片可替换');
      // pick the first material whose id differs, or just the first one
      const block = blocks.find(b => b.id === blockId);
      const next = materials.find(m => m.id !== (block && block.assetId)) || materials[0];
      const fig = previewDoc.querySelector(`figure[data-block-id="${CSS.escape(blockId)}"]`);
      if (!fig || !next) return;
      const img = fig.querySelector('img');
      if (img) { img.src = next.displayUrl; img.alt = next.title; }
      fig.dataset.assetId = next.id;
      syncBlocksFromDom();
      showToast('已替换为：' + next.title);
    }

    // ── Reverse: derive blocks[] from the contenteditable DOM ──
    function syncBlocksFromDom() {
      const next = [];
      Array.from(previewDoc.children).forEach(el => {
        const tag = el.tagName ? el.tagName.toLowerCase() : '';
        // 分页符：hr.pagebreak 或任何带 [data-pagebreak] 的直接子块。
        if (tag === 'hr' && el.classList.contains('pagebreak') || el.hasAttribute && el.hasAttribute('data-pagebreak')) {
          next.push({ id: el.dataset.blockId || makeId('pagebreak'), type: 'pagebreak' });
          return;
        }
        if (tag === 'figure') {
          const id = el.dataset.blockId || makeId('image');
          const img = el.querySelector('img');
          const assetId = el.dataset.assetId || null;
          const asset = assetId ? materials.find(m => m.id === assetId) : null;
          const url = (img && img.getAttribute('src')) || (asset && asset.displayUrl) || '';
          if (!url) return;
          next.push({
            id,
            type: 'image',
            title: (img && img.getAttribute('alt')) || (asset && asset.title) || '图片素材',
            url,
            assetId: asset ? asset.id : assetId
          });
          return;
        }
        // text-like element: h1/h2/h3 -> level; everything else -> p (one block per element)
        let level = 'p';
        if (HEADING_LEVELS.has(tag)) level = tag;
        const innerHtml = el.innerHTML;
        const md = inlineHtmlToMd(innerHtml);
        const id = el.dataset.blockId || makeId('text');
        // keep empty paragraphs while editing so caret doesn't jump; drop pure-empty on final serialize
        next.push({ id, type: 'text', level, md });
      });
      blocks = next;
      updateDerived();
    }

    function renderMaterials() {
      if (!materials.length) {
        materialGrid.innerHTML = '<div class="empty">暂无素材。生成图片会自动出现在这里，也可以导入本地图片。</div>';
        return;
      }
      materialGrid.innerHTML = materials.map(asset => `
        <div class="material-card" draggable="true" data-asset-id="${escapeHtml(asset.id)}">
          <img src="${escapeHtml(asset.displayUrl)}" alt="${escapeHtml(asset.title)}" referrerpolicy="no-referrer" />
          <button type="button" class="material-insert" data-insert="${escapeHtml(asset.id)}" title="插入到预览光标处" aria-label="插入到预览">
            <svg class="icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>插入
          </button>
          <div class="material-info">
            <div class="material-title">${escapeHtml(asset.title)} · ${escapeHtml(asset.source)}</div>
          </div>
        </div>
      `).join('');
      materialGrid.querySelectorAll('[data-insert]').forEach(btn => {
        // mousedown 不抢预览里已记忆的选区/光标
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const asset = materials.find(item => item.id === btn.dataset.insert);
          if (asset) insertImageAtCaret(asset);
        });
      });
      materialGrid.querySelectorAll('[data-asset-id]').forEach(card => {
        card.addEventListener('dragstart', event => {
          event.dataTransfer.setData('application/x-hotstream-asset', card.dataset.assetId);
          event.dataTransfer.effectAllowed = 'copy';
        });
      });
    }

    function updateDerived({ autoSave = true } = {}) {
      const count = blocks
        .filter(block => block.type === 'text')
        .map(block => inlineHtmlToMd(inlineMdToHtml(block.md)) || String(block.md || ''))
        .join('')
        .replace(/[*_#`~>\-\[\]()!]/g, '')
        .replace(/\s+/g, '').length;
      wordCount.textContent = `${count.toLocaleString('zh-CN')} 字`;
      if (autoSave) saveDraft({ silent: true });
    }

    function renderAll(options = {}) {
      renderPreview();
      renderMaterials();
      updateDerived(options);
    }

    // ── Selection helpers (so toolbar buttons can act on the last caret) ──
    function rememberSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount && previewDoc.contains(sel.anchorNode)) {
        savedSelection = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreSelection() {
      if (!savedSelection) { previewDoc.focus(); return; }
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedSelection);
    }

    function currentBlockElement() {
      const sel = window.getSelection();
      let node = (sel && sel.rangeCount && previewDoc.contains(sel.anchorNode)) ? sel.anchorNode : null;
      if (!node && savedSelection) node = savedSelection.startContainer;
      if (!node) return null;
      if (node.nodeType === 3) node = node.parentNode;
      while (node && node.parentNode !== previewDoc && node !== previewDoc) node = node.parentNode;
      return (node && node !== previewDoc) ? node : null;
    }

    function setBlockLevel(level) {
      const el = currentBlockElement();
      if (!el || el.tagName.toLowerCase() === 'figure') { showToast('请把光标放在文字段落上'); return; }
      const tag = HEADING_LEVELS.has(level) ? level : 'p';
      if (el.tagName.toLowerCase() === tag) return;
      const replacement = document.createElement(tag);
      replacement.innerHTML = el.innerHTML || '<br>';
      if (el.dataset.blockId) replacement.dataset.blockId = el.dataset.blockId;
      el.replaceWith(replacement);
      // restore caret at end of the replacement
      const range = document.createRange();
      range.selectNodeContents(replacement);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      syncBlocksFromDom();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
    }

    function syncToolbarFromSelection() {
      const el = currentBlockElement();
      if (el && el.tagName) {
        const tag = el.tagName.toLowerCase();
        blockLevelSelect.value = HEADING_LEVELS.has(tag) ? tag : 'p';
      }
      ['bold', 'italic', 'underline'].forEach(cmd => {
        const btn = document.querySelector(`.rt-btn[data-cmd="${cmd}"]`);
        if (!btn) return;
        let active = false;
        try { active = document.queryCommandState(cmd); } catch (e) {}
        btn.dataset.active = active ? '1' : '0';
      });
    }

    function execInline(cmd, value) {
      restoreSelection();
      try { document.execCommand(cmd, false, value); } catch (e) {}
      rememberSelection();
      syncBlocksFromDom();
      syncToolbarFromSelection();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
    }

    // ── Insert an image figure at the caret position ──
    function figureNodeFor(asset) {
      const block = { id: makeId('image'), type: 'image', title: asset.title, url: asset.displayUrl, assetId: asset.id };
      const wrap = document.createElement('div');
      wrap.innerHTML = imageFigureHtml(block);
      return wrap.firstElementChild;
    }

    function insertImageAtCaret(asset) {
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      const fig = figureNodeFor(asset);
      restoreSelection();
      const sel = window.getSelection();
      let blockEl = currentBlockElement();
      if (blockEl && blockEl !== previewDoc) {
        blockEl.after(fig);
      } else {
        previewDoc.appendChild(fig);
      }
      // place a fresh empty paragraph after the figure so user can keep typing
      const after = document.createElement('p');
      after.innerHTML = '<br>';
      fig.after(after);
      const range = document.createRange();
      range.selectNodeContents(after);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      wireFigureTools();
      syncBlocksFromDom();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
      showToast('素材已插入预览');
    }

    // ── 在光标所在顶层块之后插入一个分页符块，并补一个空段落便于继续输入 ──
    function insertPageBreak() {
      if (previewDoc.getAttribute('data-empty') === '1') previewDoc.removeAttribute('data-empty');
      restoreSelection();
      const hr = document.createElement('hr');
      hr.className = 'pagebreak';
      hr.setAttribute('data-pagebreak', '1');
      hr.setAttribute('contenteditable', 'false');
      hr.dataset.blockId = makeId('pagebreak');
      let blockEl = currentBlockElement();
      if (blockEl && blockEl !== previewDoc) {
        blockEl.after(hr);
      } else {
        previewDoc.appendChild(hr);
      }
      // 分页符后补一个空段落，方便继续书写下一段内容。
      const after = document.createElement('p');
      after.innerHTML = '<br>';
      after.dataset.blockId = makeId('text');
      hr.after(after);
      const range = document.createRange();
      range.selectNodeContents(after);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      previewDoc.focus();
      syncBlocksFromDom();
      if (typeof pushHistoryNow === 'function') pushHistoryNow();
      showToast('已插入分页符：导出长图时此处会切成下一张图');
    }

    function addFiles(files) {
      Array.from(files || []).forEach((file, index) => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => {
          materials.unshift({
            id: makeId(`upload-${index}`),
            title: file.name.replace(/\.[^.]+$/, ''),
            originalUrl: reader.result,
            displayUrl: reader.result,
            source: '本地导入'
          });
          renderMaterials();
          updateDerived();
          showToast('图片已加入素材区');
        };
        reader.readAsDataURL(file);
      });
    }

    // ── Export long image with html2canvas (faithful style render) ──
    //   有分页符时按 .pagebreak 切成多张图（一段一图），第 1 段带标题/来源。
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // 给克隆容器套上与现状一致的 staged 宽度/白底样式。
    function styleStagedDoc(el, docWidth) {
      el.style.width = docWidth + 'px';
      el.style.maxWidth = 'none';
      el.style.margin = '0';
      el.style.boxShadow = 'none';
      el.style.background = '#ffffff';
    }

    async function exportLongImage() {
      if (!blocks.length) return showToast('没有可导出的正文');
      if (typeof html2canvas === 'undefined') return showToast('导出库未加载，请刷新后再试');
      const title = titleInput.value.trim() || 'HotStream 文案';
      const preset = presets[document.getElementById('platformPreset').value] || presets.xhs;
      const docWidth = Math.round(preset.width / 1.86); // preview-doc max ~580px maps to 1080 export
      const safeTitle = title.replace(/[^0-9A-Za-z一-鿿_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'hotstream-long-image';

      // Build a clean clone of the styled preview (strip editing chrome).
      const clone = previewDoc.cloneNode(true);
      clone.removeAttribute('contenteditable');
      clone.removeAttribute('id');
      clone.removeAttribute('data-empty');
      clone.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
      clone.querySelectorAll('.fig-tools').forEach(n => n.remove());
      clone.querySelectorAll('.pagebreak.selected').forEach(n => n.classList.remove('selected'));

      // Prepend the title + source as styled nodes (kept out of the editable body).
      if (sourceTopic) {
        const src = document.createElement('div');
        src.className = 'source';
        const hot = sourceTopic.hot_value ? ` · 热度 ${Number(sourceTopic.hot_value).toLocaleString('zh-CN')}` : '';
        src.textContent = `来源：${sourceTopic.source || ''}${hot}`;
        clone.insertBefore(src, clone.firstChild);
      }
      if (title && !clone.querySelector('h1')) {
        const h = document.createElement('h1');
        h.textContent = title;
        clone.insertBefore(h, clone.firstChild);
      }

      // 把克隆的顶层子节点按 .pagebreak 切成 N 段（分页符本身不进任何段）。
      const segments = [[]];
      Array.from(clone.children).forEach(child => {
        const isBreak = child.tagName === 'HR' && child.classList.contains('pagebreak') || (child.hasAttribute && child.hasAttribute('data-pagebreak'));
        if (isBreak) {
          segments.push([]); // 开新段；相邻分页符 → 中间是空段，后面会过滤
        } else {
          segments[segments.length - 1].push(child);
        }
      });
      // 去掉空段（相邻分页符 / 文档首尾分页符产生的空段不出图）。
      // 去掉每段首尾的空段落（如分页符后自动补的空 <p>），避免第 2 张起顶部留白。
      const isEmptyNode = (n) => n && n.tagName === 'P' && !n.querySelector('img,figure') && !(n.textContent || '').trim();
      const trimSeg = (seg) => {
        let s = 0, e = seg.length;
        while (s < e && isEmptyNode(seg[s])) s++;
        while (e > s && isEmptyNode(seg[e - 1])) e--;
        return seg.slice(s, e);
      };
      const filled = segments.map(trimSeg).filter(seg => seg.length > 0);

      const stage = document.createElement('div');
      stage.style.cssText = 'position:fixed;left:-99999px;top:0;z-index:-1;';
      document.body.appendChild(stage);

      const h2cOpts = { useCORS: true, scale: 2, backgroundColor: '#ffffff', logging: false };

      try {
        // N==1（无有效分页符 / 仅一段）：维持现状，导出单张 文件名.png。
        if (filled.length <= 1) {
          styleStagedDoc(clone, docWidth);
          stage.appendChild(clone);
          const canvas = await html2canvas(clone, h2cOpts);
          const link = document.createElement('a');
          link.download = `${safeTitle}.png`;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          link.remove();
          showToast('长图已导出');
          return;
        }

        // N>1：逐段生成干净的 .preview-doc 克隆容器并依次渲染下载。
        const total = filled.length;
        showToast(`正在导出 ${total} 张分页图…`);
        for (let i = 0; i < total; i++) {
          const seg = document.createElement('article');
          seg.className = 'preview-doc';
          styleStagedDoc(seg, docWidth);
          // 标题/来源已 prepend 在第 1 段的节点里；后续段只放该段内容。
          filled[i].forEach(node => seg.appendChild(node));
          stage.appendChild(seg);
          const canvas = await html2canvas(seg, h2cOpts);
          const link = document.createElement('a');
          link.download = `${safeTitle}_${i + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          link.remove();
          seg.remove();
          // 同一用户手势内顺序触发多次下载；每次之间小延时避免被浏览器节流/合并。
          if (i < total - 1) await sleep(250);
        }
        showToast(`已导出 ${total} 张分页图`);
      } catch (err) {
        showToast('导出失败：' + (err && err.message ? err.message : '请稍后再试'));
      } finally {
        stage.remove();
      }
    }

    // ── Wire up the contenteditable preview ──
    let inputTimer = null;
    previewDoc.addEventListener('input', () => {
      previewDoc.removeAttribute('data-empty');
      clearTimeout(inputTimer);
      inputTimer = setTimeout(() => {
        syncBlocksFromDom();
      }, 320);
    });
    previewDoc.addEventListener('keyup', () => { rememberSelection(); syncToolbarFromSelection(); });
    previewDoc.addEventListener('mouseup', () => { rememberSelection(); syncToolbarFromSelection(); });
    previewDoc.addEventListener('focus', rememberSelection);
    previewDoc.addEventListener('blur', () => { rememberSelection(); syncBlocksFromDom(); });
    document.addEventListener('selectionchange', () => {
      if (document.activeElement === previewDoc) { rememberSelection(); }
